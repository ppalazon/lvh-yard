# The Route Profiles of this Workstation: Traefik middlewares that its Publications can name. Each middleware
# under http.middlewares is one Route Profile, in the format of Traefik:
# https://doc.traefik.io/traefik/middlewares/http/overview/
#
# The dashboard copies each valid profile into the Consul of this Workstation. Each Workstation that routes one of
# its Publications, Aliases too, applies the same profile. So a profile cannot read files (basicAuth.usersFile),
# use a plugin, or send forwardAuth to an address that only this Workstation reaches. A chain can name only
# profiles in this file.
#
# An auth profile guards only the Route. A direct connection to the address of the Instance skips Traefik, so the
# Service must still authenticate its users itself.
#
# To use an example, remove the # in front of it.

#http:
#  middlewares:
