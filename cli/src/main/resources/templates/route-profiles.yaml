#    team-login:
#      basicAuth:
#        users:
#          - "alice:$2y$05$replace.this.with.a.real.bcrypt.hash"
#
#    # Only these addresses reach the Service.
#    office-only:
#      ipAllowList:
#        sourceRange:
#          - 192.168.1.0/24
#
#    # Tells the Service that it is behind HTTPS.
