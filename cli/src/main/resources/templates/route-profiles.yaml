# This Workstation's Route Profiles: Traefik middlewares that its Publications can name. Each middleware under
# http.middlewares is one Route Profile, written in Traefik's own format:
# https://doc.traefik.io/traefik/middlewares/http/overview/
#
# The dashboard copies each valid profile into this Workstation's Consul. Every Workstation that routes one of its
# Publications, Aliases included, applies the same profile. So a profile cannot read files (basicAuth.usersFile), use a
# plugin, or send forwardAuth to an address only this Workstation reaches. A chain may name only profiles in this file.
#
# Auth profiles guard the Route only: a direct connection to the Instance's address skips Traefik, so the Service must
# still check its users itself.
#
# Remove the # in front of an example to use it.

