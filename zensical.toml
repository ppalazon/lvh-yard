# The guide at https://lvhy.cc/docs/. Its sources are in docs/guide/. `mise run pages:docs-build` builds it into
# dist/pages/docs/ in strict mode, and `mise run pages:docs-serve` previews it, drafts included.
# The landing page at https://lvhy.cc/ is separate: docs/landing/, built by `mise run pages:landing-build`.
#
# A page that the maintainer has not approved is listed in draft_docs. The build leaves it out, and the preview shows it.
# When the maintainer approves a page, remove its line from draft_docs. A published page that links to a draft page
# fails the strict build.
[project]
site_name = "LVH Yard"
site_description = "Reach any development service on your HomeLab by name, not by IP and port. The guide to LVH Yard."
copyright = 'LVH Yard is maintained by <a href="https://ppalazon.dev">Pablo Palazon</a> and licensed under <a href="https://github.com/ppalazon/lvh-yard/blob/main/LICENSE">Apache License 2.0</a>. It was developed with the help of AI tools. The maintainer reviews every change.'
site_url = "https://lvhy.cc/docs/"
repo_url = "https://github.com/ppalazon/lvh-yard"
repo_name = "ppalazon/lvh-yard"
docs_dir = "docs/guide"
site_dir = "dist/pages/docs"
draft_docs = """
"""
extra_javascript = [
  "javascripts/mermaid-box-colors.js",
  "javascripts/base-domain.js",
  "javascripts/workstation-code.js",
  "javascripts/code-style.js",
  "javascripts/header-logo.js",
]
extra_css = [
  "stylesheets/theme.css",
  "stylesheets/base-domain.css",
  "stylesheets/steps.css",
]
nav = [
  { "Home" = "index.md" },
  { "Start" = [
    { "What it solves" = "start/what-it-solves.md" },
    { "Install" = "start/install.md" },
    { "Base Domain" = "start/pick-your-base-domain.md" },
    { "First Service" = "start/first-service.md" },
  ] },
  { "Recipes" = [
    { "Names" = [
      { "HomeLab services" = "recipes/name/homelab-services.md" },
      { "Compose ports" = "recipes/name/compose-ports.md" },
      { "Process and Compose" = "recipes/name/host-process-and-compose.md" },
      { "Cookies and OAuth" = "recipes/name/cookies-and-oauth.md" },
    ] },
    { "Instances" = [
      { "Process first" = "recipes/choose/instance-priority.md" },
      { "Replicas and failover" = "recipes/choose/replicas-and-failover.md" },
      { "Alias" = "recipes/choose/swap-with-an-alias.md" },
    ] },
    { "HTTPS and access" = [
      { "Workstation CA" = "recipes/https/workstation-ca.md" },
      { "Real certificate" = "recipes/https/real-certificate.md" },
      { "Route Profiles" = "recipes/https/route-profiles.md" },
      { "Client Certificate" = "recipes/https/client-certificate.md" },
      { "Dashboard password" = "recipes/https/dashboard-password.md" },
    ] },
    { "Other computers" = [
      { "Create a Yard" = "recipes/reach/create-a-yard.md" },
      { "Another computer" = "recipes/reach/another-computer.md" },
      { "Show a teammate" = "recipes/reach/show-your-work.md" },
    ] },
    { "Problems" = [
      { "Bad Route" = "recipes/fix/bad-route.md" },
    ] },
    { "Move" = [
      { "Backup" = "recipes/move/backup.md" },
    ] },
  ] },
  { "Concepts" = [
    { "How it works" = "concepts/how-it-works.md" },
    { "The Yard" = "concepts/the-yard.md" },
    { "Instance Sources" = "concepts/instance-sources-and-priority.md" },
    { "Scope" = "concepts/scope.md" },
    { "Vocabulary" = "concepts/vocabulary.md" },
  ] },
  { "Advanced" = [
    { "Workstation Folder" = "advanced/compose-consul-traefik.md" },
    { "Register in Consul" = "advanced/register-in-consul.md" },
  ] },
  { "Reference" = [
    { "CLI" = "reference/cli.md" },
    { "Settings" = "reference/settings-and-ports.md" },
    { "Troubleshooting" = "reference/troubleshooting.md" },
    { "Documents" = "reference/links.md" },
  ] },
]

[project.theme]
language = "en"
favicon = "assets/favicon.svg"
logo = "assets/logo.svg"
icon.repo = "fontawesome/brands/github"
# No web font: the dashboard uses the system fonts, and stylesheets/theme.css sets them.
font = false
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
