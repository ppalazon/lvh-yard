# A release, from a tag such as v0.1.0: git tag v0.1.0 && git push origin v0.1.0
# Run `mise run check` before tagging; the tests need Docker and are not run here.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  # The dashboard image, at ghcr.io/<owner>/lvh-yard-dashboard, for amd64 and arm64.
  dashboard-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets GITHUB_TOKEN push to the GitHub Container Registry.
      packages: write
    steps:
      - uses: actions/checkout@v5
      # No QEMU: the Dockerfile builds app.css and the jar once, on the runner's own platform, and the per-platform
      # stage only copies the jar onto the base image.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tag v1.2.3 gives the image tags 1.2.3, 1.2 and latest, and the OCI labels that link the image to this repository.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/lvh-yard-dashboard
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
