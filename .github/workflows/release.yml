# A release, from a tag such as v0.1.0: git tag v0.1.0 && git push origin v0.1.0
# Run `mise run check` before you tag. The dashboard tests need Docker, so this workflow does not run them.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  # The dashboard image, at ghcr.io/<owner>/lvh-yard-dashboard, for amd64 and arm64.
  dashboard-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets GITHUB_TOKEN push to the GitHub Container Registry.
      packages: write
    steps:
      - uses: actions/checkout@v5
      # No QEMU: the Dockerfile builds app.css and the jar once, on the runner's own platform, and the per-platform
      # stage only copies the jar onto the base image.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tag v1.2.3 gives the image tags 1.2.3, 1.2 and latest, and the OCI labels that link the image to this repository.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/lvh-yard-dashboard
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The lvh-yard command as one executable per platform, tested before it is packed. The CLI tests run once on the
  # JVM and once against the executable (-Pnative verify). Linux builds on 22.04, because its older glibc lets the
  # executable run on more distributions.
  cli-native:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-22.04, platform: linux-amd64 }
          - { runner: ubuntu-22.04-arm, platform: linux-arm64 }
          - { runner: macos-latest, platform: macos-arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      # Sets JAVA_HOME and GRAALVM_HOME. The toolchain of the pom finds this JDK 25 through JAVA_HOME.
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - run: ./mvnw -B -Pnative -pl cli verify -Drevision="${GITHUB_REF_NAME#v}"
      # A tar keeps the executable bit, which an uploaded artifact loses.
      - run: tar -czf "lvh-yard-${GITHUB_REF_NAME#v}-${{ matrix.platform }}.tar.gz" -C cli/target lvh-yard -C ../.. LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: lvh-yard-${{ matrix.platform }}
          path: lvh-yard-*.tar.gz

  # The GitHub release, after the image is pushed and every executable is built. Its notes come from the commits
  # since the last tag. With SHA256SUMS and sha256sum -c, a user can make sure that a download is correct.
  release:
    needs: [dashboard-image, cli-native]
    runs-on: ubuntu-latest
    permissions:
      # Lets GITHUB_TOKEN create the release.
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lvh-yard-*
          merge-multiple: true
      - run: sha256sum lvh-yard-*.tar.gz > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes lvh-yard-*.tar.gz SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
