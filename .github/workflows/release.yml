# A release, from a tag such as v0.1.0: git tag v0.1.0 && git push origin v0.1.0
# The tagged commit needs a green CI run: the ci-gate job checks it. Run `mise run check` before you tag, because the
# dashboard tests need Docker and this workflow does not run them. `mise run release:status` shows what else is open.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  # Stops the release unless the tagged commit has a successful CI run (the workflow of ci.yml, which runs on main).
  # A run that is still going is awaited. No run, or a failed one, fails this job, and so every job after it.
  ci-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets GITHUB_TOKEN list and watch workflow runs.
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: |
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --json databaseId,status,conclusion)
          if [ "$(jq 'map(select(.conclusion == "success")) | length' <<<"$runs")" -gt 0 ]; then
            exit 0
          fi
          pending=$(jq -r 'map(select(.status != "completed")) | .[0].databaseId // empty' <<<"$runs")
          if [ -z "$pending" ]; then
            echo "::error::No successful CI run for $GITHUB_SHA. Push the commit to main, wait for CI to pass, then tag again."
            exit 1
          fi
          gh run watch "$pending" --repo "$GITHUB_REPOSITORY" --exit-status

  # The dashboard image, at ghcr.io/<owner>/lvh-yard-dashboard, for amd64 and arm64.
  dashboard-image:
    runs-on: ubuntu-latest
    needs: ci-gate
    permissions:
      contents: read
      # Lets GITHUB_TOKEN push to the GitHub Container Registry.
      packages: write
    steps:
      - uses: actions/checkout@v5
      # No QEMU: the Dockerfile builds app.css and the jar once, on the runner's own platform, and the per-platform
      # stage only copies the jar onto the base image.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tag v1.2.3 gives the image tags 1.2.3, 1.2 and latest, and the OCI labels that link the image to this repository.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/lvh-yard-dashboard
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The lvh-yard command as one executable per platform, tested and cross-compiled on one runner.
  cli:
    runs-on: ubuntu-latest
    needs: ci-gate
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cli
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: go test ./...
      - name: Cross-compile and pack the CLI
        run: sh ../dev/package-cli.sh "${GITHUB_REF_NAME#v}"
      # The release downloads the artifacts that match lvh-yard-*.
      - uses: actions/upload-artifact@v7
        with:
          name: lvh-yard-archives
          path: |
            cli/target/lvh-yard-*.tar.gz
            cli/target/lvh-yard-*.zip
          if-no-files-found: error

  # The GitHub release, after the image is pushed and every executable is built. Its notes come from the commits
  # since the last tag. With SHA256SUMS and sha256sum -c, a user can make sure that a download is correct.
  release:
    needs: [dashboard-image, cli]
    runs-on: ubuntu-latest
    permissions:
      # Lets GITHUB_TOKEN create the release.
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: lvh-yard-*
          merge-multiple: true
      - run: sha256sum lvh-yard-*.tar.gz lvh-yard-*.zip > SHA256SUMS
      # A tag with a hyphen, such as v0.1.1-rc.1, is a pre-release. GitHub's latest release, which install.sh and
      # install.ps1 download, never picks a pre-release.
      - run: |
          case "$GITHUB_REF_NAME" in *-*) flag=--prerelease ;; *) flag= ;; esac
          gh release create "$GITHUB_REF_NAME" $flag --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes lvh-yard-*.tar.gz lvh-yard-*.zip SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
