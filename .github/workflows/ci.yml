# The checks of a pull request and of main. They are the same as `mise run check`, `mise run fmt` and
# `mise run secrets` on your computer.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Builds the dashboard, runs every test, and smoke-tests the Go CLI. The integration tests use Docker, which the
  # runner has.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The Maven toolchain plugin finds this JDK through JAVA_HOME.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: jdx/mise-action@v5
      - run: mise run check

  # The formatters and the checks of .pre-commit-config.yaml, on every file.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: jdx/mise-action@v5
      - run: mise run fmt

  # Secrets, in the files and in the whole history.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - run: mise run secrets
