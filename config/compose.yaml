# Consul, Traefik and the dashboard for one Workstation, with the settings from .env (copy .env.example).
# Consul and Traefik use host networking. So Traefik reaches Instances on the loopback of the Workstation, and the
# federation ports of Consul face the LAN directly. The HTTP API of Consul listens on 127.0.0.1 only. Traefik and
# the dashboard listen on 127.0.0.1, unless YARD_TRAEFIK_BIND_ADDRESS and YARD_DASHBOARD_BIND_ADDRESS say
# otherwise.
services:
  # The own Consul datacenter of this Workstation, joined to the other Workstations by WAN federation (ADR-0001).
  consul:
    image: hashicorp/consul:2.1.0
    network_mode: host
    restart: unless-stopped
    user: "${YARD_UID:?set YARD_UID in .env}:${YARD_GID:?set YARD_GID in .env}"
    environment:
      YARD_WORKSTATION: ${YARD_WORKSTATION:?set YARD_WORKSTATION in .env}
      YARD_GOSSIP_KEY: ${YARD_GOSSIP_KEY:?set YARD_GOSSIP_KEY in .env}
      YARD_BIND_ADDRESS: ${YARD_BIND_ADDRESS:-}
      YARD_PEERS: ${YARD_PEERS:-}
    # A shell first: the Peers are a list, separated by spaces or commas, and -retry-join-wan takes one address.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        bind="$${YARD_BIND_ADDRESS}"
        [ -n "$$bind" ] || bind='{{ GetDefaultInterfaces | include "type" "IPv4" | attr "address" }}'
        set -f -- # -f: a Peer such as [fd00::1]:8302 is not a file pattern
        for peer in $$(printf '%s' "$${YARD_PEERS}" | tr ',' ' '); do set -- "$$@" "-retry-join-wan=$$peer"; done
        exec consul agent -config-dir=/consul/config \
          -datacenter="$${YARD_WORKSTATION}" -node="$${YARD_WORKSTATION}" \
          -encrypt="$${YARD_GOSSIP_KEY}" -bind="$$bind" \
          -http-port=${YARD_CONSUL_HTTP_PORT:-8500} -dns-port=${YARD_CONSUL_DNS_PORT:-8600} \
          -grpc-tls-port=${YARD_CONSUL_GRPC_TLS_PORT:-8503} -server-port=${YARD_CONSUL_SERVER_PORT:-8300} \
          -serf-lan-port=${YARD_CONSUL_SERF_LAN_PORT:-8301} -serf-wan-port=${YARD_CONSUL_SERF_WAN_PORT:-8302} \
          "$$@"
    # Healthy once this Workstation has a Raft leader. The leader is "" until Consul elects itself.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:${YARD_CONSUL_HTTP_PORT:-8500}/v1/status/leader | grep -q '[0-9]'",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 1s
    volumes:
      - ./consul-data:/consul/data
      - ./consul.d:/consul/config:ro
      - ./tls:/consul/tls:ro

  # Reads its Routes from the dashboard on this Workstation (ADR-0002). While the dashboard is down, it keeps the
  # last Routes.
  traefik:
    profiles: [traefik]
    image: traefik:v3.7.16
    network_mode: host
    restart: unless-stopped
    # After the dashboard, so that the first poll finds the Routes. Without the dashboard profile, Traefik starts
    # after Consul only.
    depends_on:
      consul:
        condition: service_healthy
      dashboard:
        condition: service_healthy
        required: false
    # Root, to listen on port 80. Docker gives a user that is not root no capabilities, not even NET_BIND_SERVICE.
    environment:
      YARD_TRAEFIK_BIND_ADDRESS: ${YARD_TRAEFIK_BIND_ADDRESS:-127.0.0.1}
      YARD_DASHBOARD_BIND_ADDRESS: ${YARD_DASHBOARD_BIND_ADDRESS:-127.0.0.1}
      YARD_HTTPS_PORT: ${YARD_HTTPS_PORT:-}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:${YARD_TRAEFIK_ADMIN_PORT:-8080}/ping",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s
    # A shell first, for the BindAddress rule of the dashboard: a dashboard on the wildcard 0.0.0.0 is reached
    # through loopback.
    # The admin page and the ping of Traefik are on their own entry point, always on loopback, never on web. Traefik
    # serves its API without a Route only on the entry point named traefik (--api.insecure). So that entry point is
    # the admin one, and it still answers while the dashboard, which gives the Routes, is down.
    # The access log writes one line for each request: the Route that took it, the address of the Instance that
    # answered, the status of the response and the time it took.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        dashboard="$${YARD_DASHBOARD_BIND_ADDRESS}"
        [ "$$dashboard" != 0.0.0.0 ] || dashboard=127.0.0.1
        set --
        if [ -n "$${YARD_HTTPS_PORT}" ]; then
          set -- "--entryPoints.websecure.address=$${YARD_TRAEFIK_BIND_ADDRESS}:$${YARD_HTTPS_PORT}"
        fi
        exec traefik \
          --entryPoints.web.address="$${YARD_TRAEFIK_BIND_ADDRESS}:${YARD_HTTP_PORT:-80}" \
          --entryPoints.traefik.address=127.0.0.1:${YARD_TRAEFIK_ADMIN_PORT:-8080} \
          --api.dashboard=true --api.insecure=true \
          --ping=true --ping.entryPoint=traefik \
          --providers.http.endpoint="http://$$dashboard:${YARD_DASHBOARD_PORT:-7780}/traefik/configuration" \
          --providers.http.pollInterval=5s \
          --providers.file.directory=/etc/traefik/dynamic \
          --providers.file.watch=true \
          --log.level=INFO \
          --accesslog=true "$$@"
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./tls:/etc/traefik/tls:ro

  # The dashboard image, for a Workstation without Java. It is off unless you turn it on: set
  # COMPOSE_PROFILES=dashboard in .env, or run docker compose --profile dashboard up -d.
  dashboard:
    profiles: [dashboard]
    image: ${YARD_DASHBOARD_IMAGE:-ghcr.io/ppalazon/lvh-yard-dashboard:latest}
    # Host networking: it listens on YARD_DASHBOARD_BIND_ADDRESS, where Traefik reads its Routes. It reaches Consul
    # on 127.0.0.1 and Traefik on YARD_TRAEFIK_BIND_ADDRESS.
    network_mode: host
    restart: unless-stopped
    depends_on:
      consul:
        condition: service_healthy
    # A dashboard on the wildcard 0.0.0.0 is reached through loopback.
    healthcheck:
      test:
        - CMD-SHELL
        - |
          host="$${YARD_DASHBOARD_BIND_ADDRESS}"
          [ "$$host" != 0.0.0.0 ] || host=127.0.0.1
          curl -fsS -o /dev/null "http://$$host:$${YARD_DASHBOARD_PORT}/actuator/health"
      interval: 30s
      timeout: 5s
      start_period: 120s
      start_interval: 1s
    # The user from .env, not root, with the group of the Docker socket so that it can read the socket. The group has
    # no default, because it differs on each computer. It is not required with :?, because that stops Compose even
    # when the dashboard profile is off. If it is not set, Docker does not start the dashboard: "unable to find group".
    user: "${YARD_UID:-1000}:${YARD_GID:-1000}"
    group_add:
      - "${YARD_DOCKER_GID:-}"
    # The defaults are the dashboard's own (application.yaml). YARD_OUT_OF_RANGE uses - and not :-, so it takes its
    # default only when it is not set. If it is set but empty, no address is out of range.
    environment:
      YARD_WORKSTATION: ${YARD_WORKSTATION:?set YARD_WORKSTATION in .env}
      YARD_BASE_DOMAIN: ${YARD_BASE_DOMAIN:-lvh.me}
      YARD_OUT_OF_RANGE: ${YARD_OUT_OF_RANGE-127.0.0.0/8,::1/128,172.17.0.0/16,172.18.0.0/15,172.20.0.0/14,172.24.0.0/13}
      YARD_HTTP_PORT: ${YARD_HTTP_PORT:-80}
      YARD_HTTPS_PORT: ${YARD_HTTPS_PORT:-}
      YARD_TRAEFIK_BIND_ADDRESS: ${YARD_TRAEFIK_BIND_ADDRESS:-127.0.0.1}
      YARD_TRAEFIK_ADMIN_PORT: ${YARD_TRAEFIK_ADMIN_PORT:-8080}
      YARD_TRAEFIK_ENABLED: ${YARD_TRAEFIK_ENABLED:-true}
      YARD_DASHBOARD_PORT: ${YARD_DASHBOARD_PORT:-7780}
      YARD_DASHBOARD_BIND_ADDRESS: ${YARD_DASHBOARD_BIND_ADDRESS:-127.0.0.1}
      YARD_CONSUL_HTTP_PORT: ${YARD_CONSUL_HTTP_PORT:-8500}
      YARD_PEERS: ${YARD_PEERS:-}
      YARD_STACK_TRACES: ${YARD_STACK_TRACES:-false}
      YARD_BACKUPS: /var/lib/lvh-yard/backups
    # The Container Bindings follow the containers of this Workstation. The dashboard writes Backups to backups/, and
    # lvh-yard ws init creates that folder, so that it belongs to the user and not to root.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backups:/var/lib/lvh-yard/backups
      - ./lvh-yard.yaml:/app/config/application.yaml:ro

