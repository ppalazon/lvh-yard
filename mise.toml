[tools]
node = "24"
prek = "0.3.10"

[tasks."css:install"]
description = "Install Tailwind CSS and Basecoat into node_modules/, as package-lock.json pins them"
sources = ["package-lock.json"]
outputs = ["node_modules/.package-lock.json"]
run = "npm ci --silent"

[tasks.css]
description = "Build the dashboard's app.css from the classes its web views use"
depends = ["css:install"]
run = "npx tailwindcss -i dashboard/src/main/css/app.css -o dashboard/src/main/resources/static/app.css --minify"

[tasks."css:watch"]
description = "Rebuild app.css whenever a web view or app.css's source changes"
depends = ["css:install"]
run = "npx tailwindcss -i dashboard/src/main/css/app.css -o dashboard/src/main/resources/static/app.css --minify --watch"

[tasks.hooks]
description = "Install the git hook that formats and checks files before each commit (.pre-commit-config.yaml)"
run = "prek install"

[tasks.fmt]
description = "Format and check every file, as the pre-commit hook does"
run = "prek run --all-files"

[tasks.check]
description = "Build app.css, build both modules from scratch and run every test"
# clean: compiled classes of moved or deleted sources otherwise linger in target/ and fail as phantom tests.
# -T 2: the cli module does not depend on the dashboard, so both build at the same time.
run = [{ task = "css" }, "./mvnw -q -T 2 clean verify"]

[tasks.native]
description = "Build the lvh-yard executable with GraalVM, and run the CLI's tests on it: cli/target/lvh-yard"
# GraalVM for this task only, as the release workflow uses it. JAVA_HOME then names it, whatever GRAALVM_HOME says.
# clean: picocli-codegen lists the commands' options only when Maven recompiles them.
tools = { java = "graalvm-community-25.0.2" }
run = 'GRAALVM_HOME="$JAVA_HOME" ./mvnw -q -Pnative -pl cli clean verify'

[tasks."native:optimize"]
description = "Build lvh-yard for speed (-O3) or size (-Os), and run the CLI's tests on it: mise run native:optimize [--for size]"
# -O3 starts faster and is smaller than the default -O2. -Os is 20% smaller again, but each command starts about 2 ms slower.
# -Dnative.optimization, not -DbuildArgs: -DbuildArgs replaces the pom's buildArgs and drops the NativeRecords Feature.
usage = 'flag "--for <goal>" default="speed" help="speed or size" { choices "speed" "size" }'
tools = { java = "graalvm-community-25.0.2" }
run = """
level=3; [ "$usage_for" = size ] && level=s
GRAALVM_HOME="$JAVA_HOME" ./mvnw -q -Pnative -pl cli clean verify -Dnative.optimization="$level"
"""

[tasks."native:copy"]
description = "Copy cli/target/lvh-yard to another computer through ssh: mise run native:copy user@host [--dir .local/bin]"
# The other computer needs the same OS and CPU type as this one.
# A new file, then mv: a running lvh-yard cannot be overwritten in place ("Text file busy").
usage = """
arg "<host>" help="The ssh destination, for example user@host"
flag "--dir <dir>" default=".local/bin" help="The folder for lvh-yard on that computer, relative to its home folder"
"""
run = """
[ -x cli/target/lvh-yard ] || { echo "cli/target/lvh-yard is missing. Build it first with mise run native." >&2; exit 1; }
ssh -C "$usage_host" "mkdir -p '$usage_dir' && cat > '$usage_dir/lvh-yard.new' && chmod +x '$usage_dir/lvh-yard.new' && mv '$usage_dir/lvh-yard.new' '$usage_dir/lvh-yard'" < cli/target/lvh-yard
echo "Copied lvh-yard to $usage_host:$usage_dir/lvh-yard"
"""

[tasks."native:install"]
description = "Copy cli/target/lvh-yard to a folder on this computer: mise run native:install [--dir ~/.local/bin]"
# A new file, then mv: a running lvh-yard cannot be overwritten in place ("Text file busy").
usage = 'flag "--dir <dir>" default="~/.local/bin" help="The folder for lvh-yard"'
run = """
[ -x cli/target/lvh-yard ] || { echo "cli/target/lvh-yard is missing. Build it first with mise run native." >&2; exit 1; }
dir="${usage_dir/#\\~/$HOME}"
mkdir -p "$dir"
cp cli/target/lvh-yard "$dir/lvh-yard.new"
mv "$dir/lvh-yard.new" "$dir/lvh-yard"
echo "Installed lvh-yard to $dir/lvh-yard"
"""

[tasks.install]
description = "Build the dashboard image and lvh-yard, and copy lvh-yard to ~/.local/bin"
run = [{ task = "dashboard:image" }, { task = "native" }, { task = "native:install" }]

[tasks.openapi]
description = "Rewrite dashboard/openapi.yaml from the running dashboard's OpenAPI document"
run = "./mvnw -q -pl dashboard test -Dtest=OpenApiTest#committedCopyIsCurrent -Dopenapi.update=true -Dsurefire.failIfNoSpecifiedTests=false"

[tasks.up]
description = "Start this Workstation's Consul and Traefik, as .env sets them up"
run = "docker compose up -d"

[tasks.down]
description = "Stop this Workstation's Consul and Traefik"
run = "docker compose down"

[tasks."dashboard:run"]
description = "Run the dashboard on this Workstation, as .env sets it up"
depends = ["css"]
run = "./mvnw -q -pl dashboard spring-boot:run"

[tasks."dashboard:image"]
description = "Build the dashboard image: mise run dashboard:image [--platform linux/arm64]"
# The tag is the default image of compose.yaml, so docker compose on a Workstation uses this build without a change to .env.
usage = 'flag "--platform <platform>" help="The platform of the Workstation that runs the image, for example linux/arm64"'
run = 'docker build ${usage_platform:+--platform "$usage_platform"} -t ghcr.io/ppalazon/lvh-yard-dashboard:latest .'

[tasks."dashboard:copy"]
description = "Copy the dashboard image to another computer through ssh: mise run dashboard:copy user@host"
usage = 'arg "<host>" help="The ssh destination, for example user@host"'
# -C compresses the image on the way. The other computer needs no registry, only Docker and ssh.
run = 'docker save ghcr.io/ppalazon/lvh-yard-dashboard:latest | ssh -C "$usage_host" docker load'

[tasks."dev:up"]
description = "Start a Yard of two test Workstations, ws-a and ws-b, on this computer (dev/*.env)"
run = [
  "docker compose -p ws-a --env-file dev/ws-a.env up -d",
  "docker compose -p ws-b --env-file dev/ws-b.env up -d",
]

[tasks."dev:down"]
description = "Stop the two test Workstations"
run = ["docker compose -p ws-a down", "docker compose -p ws-b down"]

[tasks."dev:dashboard"]
description = "Run the dashboard of test Workstation ws-a or ws-b: mise run dev:dashboard ws-b"
depends = ["css"]
usage = 'arg "<workstation>" help="ws-a or ws-b"'
run = "set -a; . dev/${usage_workstation}.env; set +a; ./mvnw -q -pl dashboard spring-boot:run"
