[tools]
node = "24"
prek = "0.3.10"
go = "1.27.3"
gitleaks = "8.30.1"
golangci-lint = "2.15.0"

[tasks."css:install"]
description = "Install Tailwind CSS and Basecoat into node_modules/, as package-lock.json pins them"
sources = ["package-lock.json"]
outputs = ["node_modules/.package-lock.json"]
run = "npm ci --silent"

[tasks.css]
description = "Build the dashboard's app.css from the classes its web views use"
depends = ["css:install"]
run = "npx tailwindcss -i dashboard/src/main/css/app.css -o dashboard/src/main/resources/static/app.css --minify"

[tasks."css:watch"]
description = "Rebuild app.css whenever a web view or app.css's source changes"
depends = ["css:install"]
run = "npx tailwindcss -i dashboard/src/main/css/app.css -o dashboard/src/main/resources/static/app.css --minify --watch"

[tasks."site:build"]
description = "Build the landing page of docs/site into docs/site/dist"
depends = ["css:install"]
run = [
  "rm -rf docs/site/dist",
  "mkdir -p docs/site/dist",
  "npx tailwindcss -i docs/site/site.css -o docs/site/dist/site.css --minify",
  "cp docs/site/index.html docs/site/dist/",
  "cp docs/site/install.sh docs/site/dist/",
  "cp dashboard/src/main/resources/static/theme.js docs/site/dist/",
  "cp -r docs/site/assets docs/site/dist/assets",
]

[tasks."site:serve"]
description = "Build the landing page and serve it at http://localhost:8800"
depends = ["site:build"]
run = "python3 -m http.server 8800 --directory docs/site/dist"

[tasks.hooks]
description = "Install the git hook that formats and checks files before each commit (.pre-commit-config.yaml)"
run = "prek install"

[tasks.fmt]
description = "Format and check every file, as the pre-commit hook does"
run = "prek run --all-files"

[tasks.secrets]
description = "Scan the working tree and the whole git history for secrets, with the rules of .gitleaks.toml"
run = ["gitleaks dir --no-banner --redact .", "gitleaks git --no-banner --redact ."]

[tasks.check]
description = "Build app.css, build the dashboard from scratch, check the Go CLI and smoke-test it"
# clean: compiled classes of moved or deleted sources otherwise linger in target/ and fail as phantom tests.
# sources and auto outputs: mise skips the task if no source changed after the last run that passed.
sources = [
  "pom.xml", "dashboard/pom.xml", "dashboard/pmd-gate.xml", "dashboard/spotbugs-exclude.xml", ".mvn/**/*", "package-lock.json",
  "cli/**/*.go", "cli/go.mod", "cli/go.sum", "cli/.golangci.yml",
  "dashboard/src/**/*", "dashboard/openapi.yaml", "config/**/*", "config/.env.example",
]
outputs = { auto = true }
run = [{ task = "css" }, "./mvnw -q clean verify", { task = "cli:check" }, { task = "cli:smoke" }]

[tasks."test:unit"]
description = "Run the dashboard unit tests and check the Go CLI, without Spring or Docker"
run = [
  "./mvnw -q test -Dtest='*Test,!*ComponentTest' -Dsurefire.failIfNoSpecifiedTests=false",
  { task = "cli:check" },
]

[tasks."test:component"]
description = "Run the dashboard's component tests: the dashboard with fake Consul and Docker, without Docker"
run = "./mvnw -q -pl dashboard test -Dtest='*ComponentTest' -Dsurefire.failIfNoSpecifiedTests=false"

[tasks."cli:templates"]
description = "Refresh the Go CLI's embedded configuration templates"
run = [
  "cp config/compose.yaml cli/internal/templates/compose.yaml",
  "cp config/.env.example cli/internal/templates/.env.example",
  "cp config/00-lvh-yard.hcl cli/internal/templates/00-lvh-yard.hcl",
  "cp config/10-tls.hcl cli/internal/templates/10-tls.hcl",
  "cp config/10-tls.yaml cli/internal/templates/10-tls.yaml",
  "cp config/lvh-yard.yaml cli/internal/templates/lvh-yard.yaml",
]

[tasks."cli:build"]
description = "Build the Go lvh-yard executable in cli/target"
dir = "{{config_root}}/cli"
run = 'CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${VERSION:-dev}" -o target/lvh-yard ./cmd/lvh-yard'

[tasks."cli:check"]
description = "Run go vet, golangci-lint and the Go CLI unit tests"
dir = "{{config_root}}/cli"
# The gate runs only the linters that report nothing today. quality:go runs the full set of cli/.golangci.yml.
run = [
  "go vet ./...",
  "golangci-lint run --enable-only=errcheck,errorlint,modernize,staticcheck,bodyclose,misspell,unconvert,govet,ineffassign,unused ./...",
  "go test ./...",
]

[tasks."cli:smoke"]
description = "Run the Go CLI smoke test: the built executable against a fake dashboard"
dir = "{{config_root}}/cli"
run = "go test -tags integration -count=1 ./cmd/lvh-yard"

[tasks."cli:install"]
description = "Build the lvh-yard executable and copy it to a folder on this computer: mise run cli:install"
# A new file, then mv: a running lvh-yard cannot be overwritten in place ("Text file busy").
usage = 'flag "--dir <dir>" default="~/.local/bin" help="The folder for lvh-yard"'
depends = ["cli:build"]
run = """
dir="${usage_dir/#\\~/$HOME}"
mkdir -p "$dir"
cp cli/target/lvh-yard "$dir/lvh-yard.new"
mv "$dir/lvh-yard.new" "$dir/lvh-yard"
echo "Installed lvh-yard to $dir/lvh-yard"
"""

[tasks."install:local"]
description = "Install the CLI and build the dashboard image on this computer: mise run install:local"
usage = 'flag "--dir <dir>" default="~/.local/bin" help="The folder for lvh-yard"'
run = [
  { task = "cli:install", args = ["--dir", "{{usage.dir}}"] },
  { task = "dashboard:image" },
]

[tasks."install:ssh"]
description = "Copy the CLI and the dashboard image to another computer through ssh: mise run install:ssh user@host"
# The other computer needs ssh, Docker and the folder, not a registry. Both builds are for the system and CPU of this computer.
# The new file, then mv: a running lvh-yard cannot be overwritten in place.
usage = '''
arg "<host>" help="The ssh destination, for example user@host"
flag "--dir <dir>" default="~/.local/bin" help="The folder for lvh-yard on the other computer"
'''
depends = ["cli:build", "dashboard:image"]
run = [
  'ssh -C "$usage_host" "cat > $usage_dir/lvh-yard.new && chmod +x $usage_dir/lvh-yard.new && mv $usage_dir/lvh-yard.new $usage_dir/lvh-yard" < cli/target/lvh-yard',
  'docker save ghcr.io/ppalazon/lvh-yard-dashboard:latest | ssh -C "$usage_host" docker load',
]

[tasks.openapi]
description = "Rewrite dashboard/openapi.yaml from the running dashboard's OpenAPI document"
# OpenApiComponentTest is a component test, so surefire runs it without Docker.
run = "./mvnw -q -pl dashboard test -Dtest=OpenApiComponentTest#committedCopyIsCurrent -Dopenapi.update=true"

[tasks.audit]
description = "Print the measures of a consolidation audit: stale learnings, done specs, test counts and sizes"
usage = 'flag "--check" help="Also time mise run check and count its output lines"'
run = 'node dev/audit.mjs ${usage_check:+--check}'

[tasks."dashboard:image"]
description = "Build the dashboard image: mise run dashboard:image"
# The tag is the default image of compose.yaml, so docker compose on a Workstation uses this build without a change to .env.
usage = 'flag "--platform <platform>" help="The platform of the Workstation that runs the image, for example linux/arm64"'
run = 'docker build ${usage_platform:+--platform "$usage_platform"} -t ghcr.io/ppalazon/lvh-yard-dashboard:latest .'

[tasks."dashboard:run"]
description = "Run the dashboard from the sources on a Workstation Folder, ~/.config/lvh-yard by default: mise run dashboard:run"
# It reads .env and lvh-yard.yaml of the folder, as the dashboard image does in Compose. Stop the dashboard container of that
# Workstation first, as both use YARD_DASHBOARD_PORT.
usage = 'flag "--dir <dir>" default="~/.config/lvh-yard" help="The Workstation Folder that the dashboard reads"'
depends = ["css"]
run = """
folder="${usage_dir/#\\~/$HOME}"
[ -f "$folder/.env" ] || { echo "No .env in $folder. Run lvh-yard ws init first." >&2; exit 1; }
set -a
. "$folder/.env"
YARD_BACKUPS="$folder/backups"
SPRING_CONFIG_ADDITIONAL_LOCATION="optional:file:$folder/lvh-yard.yaml"
set +a
./mvnw -q -pl dashboard spring-boot:run
"""

[tasks."dev:up"]
description = "Start Consul and Traefik for two test Workstation Folders"
depends = ["cli:build"]
run = 'bash dev/workstations.sh up "$PWD/cli/target/lvh-yard" "$PWD"'

[tasks."dev:down"]
description = "Stop the two test Workstations"
depends = ["cli:build"]
run = 'bash dev/workstations.sh down "$PWD/cli/target/lvh-yard" "$PWD"'

[tasks."dev:dashboard"]
description = "Run the dashboard of test Workstation ws-a or ws-b: mise run dev:dashboard ws-b"
usage = 'arg "<workstation>" help="ws-a or ws-b"'
run = [
  'case "$usage_workstation" in ws-a|ws-b) ;; *) echo "Use ws-a or ws-b." >&2; exit 1 ;; esac',
  { task = "dashboard:run", args = ["--dir", "{{config_root}}/dev/{{usage.workstation}}"] },
]

[tasks."quality:go"]
description = "Run golangci-lint on the Go CLI and print each finding. It does not fail the task"
dir = "{{config_root}}/cli"
run = "golangci-lint run --issues-exit-code=0 ./..."

[tasks."quality:java"]
description = "Run SpotBugs and PMD on the dashboard. The reports are dashboard/target/spotbugsXml.xml and dashboard/target/pmd.xml"
run = "./mvnw -q -pl dashboard -DskipTests compile spotbugs:spotbugs pmd:pmd@report"

[tasks."quality:mutation"]
description = "Run PIT mutation tests with the dashboard unit tests. The report is dashboard/target/pit-reports/index.html"
run = "./mvnw -B -pl dashboard test-compile org.pitest:pitest-maven:mutationCoverage"

[tasks.quality]
description = "Run the slow code checks: golangci-lint, SpotBugs, PMD and PIT. Not part of mise run check"
depends = ["quality:go", "quality:java", "quality:mutation"]
