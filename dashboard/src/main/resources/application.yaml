spring:
  application:
    name: dashboard
  config:
    # The Workstation's settings live in the git-ignored .env at the repository root, which compose.yaml reads too.
    # spring-boot:run starts in dashboard/, a packaged jar wherever it is launched; environment variables work too.
    import: optional:file:../.env[.properties],optional:file:.env[.properties]

server:
  # Loopback only: Traefik on the same Workstation is the way in, at yard.<base-domain>.
  address: 127.0.0.1
  port: ${YARD_DASHBOARD_PORT:8780}

# The OpenAPI document of the REST API, at /v3/api-docs, which the CLI is written against. Its committed copy is
# dashboard/openapi.yaml: `mise run openapi` rewrites it.
springdoc:
  paths-to-match: /api/**
  default-produces-media-type: application/json
  # Sorted keys keep the committed copy free of reordering noise.
  writer-with-order-by-keys: true

lvh-yard:
  workstation:
    name: ${YARD_WORKSTATION:ws-a}
    base-domain: ${YARD_BASE_DOMAIN:lvh.me}
  # The addresses only an Instance's own Workstation can reach: loopback and Docker's default bridge networks. A Remote
  # Service's Instance there is out of range here and gets no Route. YARD_OUT_OF_RANGE replaces the whole list.
  out-of-range:
    ranges: ${YARD_OUT_OF_RANGE:127.0.0.0/8,::1/128,172.17.0.0/16,172.18.0.0/15,172.20.0.0/14,172.24.0.0/13}
  # This Workstation's Consul agent, whose HTTP API listens on loopback only (compose.yaml).
  consul:
    url: http://127.0.0.1:${YARD_CONSUL_HTTP_PORT:8500}
  # This Workstation's Docker, whose containers the Container Bindings follow: DOCKER_HOST, as the docker command uses it.
  docker:
    host: ${DOCKER_HOST:unix:///var/run/docker.sock}
