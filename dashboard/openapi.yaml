openapi: 3.1.0
info:
  description: "The Services of the Yard, and the Static Instances and Publications\
    \ of this Workstation's Services"
  title: LVH Yard
servers:
- url: /
paths:
  /api/services:
    get:
      operationId: yardServices
      parameters:
      - description: Only the Services of this Workstation
        in: query
        name: workstation
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
          description: OK
      summary: "Every Service in the Yard, with its Instances and their Health"
      tags:
      - services-controller
  /api/services/{workstation}/{service}:
    get:
      operationId: yardService
      parameters:
      - in: path
        name: workstation
        required: true
        schema:
          type: string
      - in: path
        name: service
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The Workstation has no Service of this name
      summary: "One Service, with its Instances and their Health"
      tags:
      - services-controller
  /api/workstation/services:
    get:
      operationId: ownServices
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
          description: OK
      summary: "This Workstation's Services, with their Instances and their Health"
      tags:
      - workstation-services-controller
  /api/workstation/services/{service}:
    get:
      operationId: ownService
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: This Workstation has no Service of this name
      summary: "One of this Workstation's Services, with its Instances and their Health"
      tags:
      - workstation-services-controller
  /api/workstation/services/{service}/instances:
    post:
      description: "The Instance gets a TCP check on its port, and is critical until\
        \ the check first passes. Registering the same host and port again replaces\
        \ that Instance, which keeps its ID."
      operationId: register
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaticInstanceRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
          description: Registered
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The name is not a single DNS label or is yard, the host is\
            \ not an IP address or a hostname, or the port is missing or not a TCP\
            \ port"
      summary: "Registers a Static Instance; with no host, at this Workstation's LAN\
        \ address"
      tags:
      - workstation-services-controller
  /api/workstation/services/{service}/instances/{id}:
    delete:
      operationId: remove
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Removed
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The Service has no Static Instance with this ID
      summary: Removes a Static Instance; a Service with nothing left leaves the Catalog
      tags:
      - workstation-services-controller
  /api/workstation/services/{service}/publication:
    delete:
      description: A Service with no Instances left leaves the Catalog.
      operationId: unpublish
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      responses:
        "204":
          description: "Unpublished, or it was not published"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: This Workstation has no Service of this name
      summary: "Unpublishes a Service, which keeps every Instance registered"
      tags:
      - workstation-services-controller
    put:
      description: "The Route covers every Instance of the Service, including ones\
        \ registered later. Publishing a published Service again changes nothing."
      operationId: publish
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
          description: "The Service, published"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The name is not a single DNS label or is yard
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: This Workstation has no Service of this name
      summary: "Publishes a Service at <service>.<base-domain>, with Local Scope"
      tags:
      - workstation-services-controller
components:
  schemas:
    Instance:
      type: object
      properties:
        health:
          type: string
          enum:
          - passing
          - warning
          - critical
        host:
          type: string
        id:
          type: string
        port:
          type: integer
          format: int32
      required:
      - health
      - host
      - id
      - port
    ProblemDetail:
      type: object
      additionalProperties: true
      properties:
        detail:
          type: string
        instance:
          type: string
          format: uri
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          format: uri
    Publication:
      type: object
      properties:
        scope:
          type: string
          enum:
          - local
      required:
      - scope
    Service:
      type: object
      properties:
        hostname:
          type: string
        instances:
          type: array
          items:
            $ref: "#/components/schemas/Instance"
        name:
          type: string
        publication:
          $ref: "#/components/schemas/Publication"
        state:
          type: string
          enum:
          - unpublished
          - unavailable
          - unhealthy
          - healthy
        workstation:
          type: string
      required:
      - instances
      - name
      - state
      - workstation
    StaticInstanceRequest:
      type: object
      properties:
        host:
          type: string
        port:
          type: integer
          format: int32
      required:
      - port
