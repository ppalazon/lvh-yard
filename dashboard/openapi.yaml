openapi: 3.1.0
info:
  description: "The Yard's Workstations and Services, and this Workstation's Instances,\
    \ Publications and Aliases. A change to a Remote Service is refused with 405.\
    \ A change that would break a Core Service is refused with 409."
  title: LVH Yard
servers:
- url: /
paths:
  /api/services:
    get:
      description: "This Workstation's Services first, then by Workstation and name.\
        \ An unreachable Workstation's Services are left out: /api/yard shows which\
        \ ones."
      operationId: yardServices
      parameters:
      - description: Only the Services of this Workstation
        in: query
        name: workstation
        required: false
        schema:
          type: string
      - description: Only the Services in this state
        in: query
        name: state
        required: false
        schema:
          type: string
          enum:
          - unpublished
          - unavailable
          - unhealthy
          - healthy
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No Service state has this name
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The Yard has no Workstation of this name
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The Workstation is unreachable
      summary: Lists every Service in the Yard
      tags:
      - services-controller
  /api/services/{workstation}/{service}:
    get:
      operationId: yardService
      parameters:
      - in: path
        name: workstation
        required: true
        schema:
          type: string
      - in: path
        name: service
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The Yard has no Workstation of this name, or it has no Service\
            \ of this name"
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The Workstation is unreachable
      summary: Gets one Service
      tags:
      - services-controller
  /api/services/{workstation}/{service}/reachability:
    get:
      description: "Connects to each Instance, and requests each hostname through\
        \ this Workstation's Traefik. The results are not stored."
      operationId: testReachability
      parameters:
      - in: path
        name: workstation
        required: true
        schema:
          type: string
      - in: path
        name: service
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reachability"
          description: "Tested, whether the checks passed or not"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The Yard has no Workstation of this name, or it has no Service\
            \ of this name"
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The Workstation is unreachable
      summary: Tests whether this Workstation reaches a Service
      tags:
      - services-controller
  /api/status:
    get:
      description: "Each part is ok, warning or failing. The answer is kept for about\
        \ 5 s."
      operationId: status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: OK
      summary: Gets whether the Core Services work on this Workstation
      tags:
      - status-controller
  /api/workstation/aliases:
    get:
      operationId: aliases
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alias"
          description: OK
      summary: Lists this Workstation's Aliases
      tags:
      - aliases-controller
  /api/workstation/aliases/{alias}:
    delete:
      operationId: removeAlias
      parameters:
      - in: path
        name: alias
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Removed
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: This Workstation has no Alias of this name
      summary: Removes an Alias
      tags:
      - aliases-controller
    put:
      operationId: addAlias
      parameters:
      - in: path
        name: alias
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AliasRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alias"
          description: "The Alias, with its state"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The name is not a single DNS label or is taken by a Core Service,\
            \ or the Workstation is this one"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The Yard has no Workstation of this name, or it has no Service\
            \ of this name"
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The Workstation is unreachable, so its Services are not known"
      summary: Adds an Alias for a Remote Service
      tags:
      - aliases-controller
  /api/workstation/services:
    get:
      operationId: ownServices
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
          description: OK
      summary: Lists this Workstation's Services
      tags:
      - workstation-services-controller
  /api/workstation/services/{service}:
    get:
      operationId: ownService
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: This Workstation has no Service of this name
      summary: Gets one of this Workstation's Services
      tags:
      - workstation-services-controller
  /api/workstation/services/{service}/container-bindings:
    post:
      description: "Give either container, or composeProject and composeService. Each\
        \ running container that matches is a Bound Instance with a TCP check. Binding\
        \ the same again changes nothing."
      operationId: bindContainer
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerBindingRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerBinding"
          description: Bound
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The name is not a single DNS label or is taken by a Core Service,\
            \ the body names both or neither of a container and a Compose service,\
            \ a name is not one Docker or Compose allows, or the port is not a TCP\
            \ port"
      summary: Binds a Service to a container or a Compose service
      tags:
      - workstation-services-controller
  /api/workstation/services/{service}/container-bindings/{id}:
    delete:
      description: A Service with nothing left leaves the Catalog.
      operationId: unbindContainer
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Removed
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The Service has no Container Binding with this ID
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The Service is a Core Service
      summary: Removes a Container Binding and its Bound Instances
      tags:
      - workstation-services-controller
  /api/workstation/services/{service}/instances:
    post:
      description: "With no host, the Instance is at this Workstation's LAN address.\
        \ With no check, it gets a TCP check on its port. It is critical until its\
        \ check first passes. The same host and port again replaces that Instance,\
        \ which keeps its ID."
      operationId: register
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaticInstanceRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
          description: Registered
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The name is not a single DNS label or is taken by a Core Service.\
            \ The host, port, check, tags or meta break a rule"
      summary: Registers a Static Instance
      tags:
      - workstation-services-controller
  /api/workstation/services/{service}/instances/{id}:
    delete:
      operationId: remove
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Removed
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The Service has no Static Instance with this ID
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The Instance belongs to a Core Service
      summary: Removes a Static Instance
      tags:
      - workstation-services-controller
    put:
      description: "A part left out gets its default, not its old value. The Instance\
        \ keeps its ID. It is critical until its check first passes."
      operationId: editInstance
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaticInstanceRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
          description: Edited
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The host, port, check, tags or meta break a rule. Or another\
            \ Instance of the Service is at the host and port"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The Service has no Static Instance with this ID
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The Instance belongs to a Core Service
      summary: Edits a Static Instance
      tags:
      - workstation-services-controller
  /api/workstation/services/{service}/publication:
    delete:
      description: A Service with no Instances left leaves the Catalog.
      operationId: unpublish
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      responses:
        "204":
          description: "Unpublished, or it was not published"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: This Workstation has no Service of this name
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The Service is a Core Service
      summary: Unpublishes a Service
      tags:
      - workstation-services-controller
    put:
      description: "With Yard Scope, the other Workstations also route it, at <service>.<workstation>.<base-domain>.\
        \ With no Scope, a new Publication gets Local Scope and an existing one keeps\
        \ its own."
      operationId: publish
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
          description: "The Service, published"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The name is not a single DNS label or is taken by a Core Service,\
            \ or the Scope is not local or yard"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: This Workstation has no Service of this name
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The Service is a Core Service and the Scope is yard
      summary: "Publishes a Service, or changes its Scope"
      tags:
      - workstation-services-controller
  /api/workstation/services/{service}/reachability:
    get:
      description: "As /api/services/{workstation}/{service}/reachability does, without\
        \ naming this Workstation."
      operationId: testOwnReachability
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reachability"
          description: "Tested, whether the checks passed or not"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: This Workstation has no Service of this name
      summary: Tests whether this Workstation reaches one of its own Services
      tags:
      - workstation-services-controller
  /api/yard:
    get:
      description: "The other Workstations come by name. An unreachable one has no\
        \ Services, and the others still load."
      operationId: yard
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Yard"
          description: OK
      summary: "Gets every Workstation of the Yard, with its Services"
      tags:
      - yard-controller
components:
  schemas:
    Alias:
      type: object
      properties:
        hostname:
          type: string
        name:
          type: string
        reason:
          type: string
        service:
          type: string
        state:
          type: string
          enum:
          - active
          - unavailable
          - fallback
          - hidden
          - not-shared
          - unreachable
          - missing
        workstation:
          type: string
      required:
      - hostname
      - name
      - service
      - state
      - workstation
    AliasRequest:
      type: object
      properties:
        service:
          type: string
        workstation:
          type: string
      required:
      - service
      - workstation
    CheckResult:
      type: object
      properties:
        health:
          type: string
          enum:
          - passing
          - warning
          - critical
        name:
          type: string
        output:
          type: string
      required:
      - health
      - name
      - output
    ContainerBinding:
      type: object
      properties:
        composeProject:
          type: string
        composeService:
          type: string
        container:
          type: string
        id:
          type: string
        instances:
          type: array
          items:
            type: string
        port:
          type: integer
          format: int32
      required:
      - id
      - instances
      - port
    ContainerBindingRequest:
      type: object
      properties:
        composeProject:
          type: string
        composeService:
          type: string
        container:
          type: string
        port:
          type: integer
          format: int32
      required:
      - port
    HealthCheck:
      type: object
      properties:
        interval:
          type: string
        path:
          type: string
        timeout:
          type: string
        type:
          type: string
          enum:
          - http
          - tcp
    HomeWorkstation:
      type: object
      properties:
        name:
          type: string
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
      required:
      - name
      - services
    Instance:
      type: object
      properties:
        check:
          $ref: "#/components/schemas/HealthCheck"
        checks:
          type: array
          items:
            $ref: "#/components/schemas/CheckResult"
        containerBinding:
          type: string
        core:
          type: boolean
        health:
          type: string
          enum:
          - passing
          - warning
          - critical
        host:
          type: string
        id:
          type: string
        meta:
          type: object
          additionalProperties:
            type: string
        outOfRange:
          type: boolean
        port:
          type: integer
          format: int32
        tags:
          type: array
          items:
            type: string
        unpublishedContainerPort:
          type: boolean
      required:
      - checks
      - health
      - host
      - id
      - meta
      - outOfRange
      - port
      - tags
    InstanceReachability:
      type: object
      properties:
        address:
          type: string
        error:
          type: string
        id:
          type: string
        outOfRange:
          type: boolean
        reached:
          type: boolean
      required:
      - address
      - id
      - reached
    ProblemDetail:
      type: object
      additionalProperties: true
      properties:
        detail:
          type: string
        instance:
          type: string
          format: uri
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          format: uri
    Publication:
      type: object
      properties:
        scope:
          type: string
          enum:
          - local
          - yard
      required:
      - scope
    PublicationRequest:
      type: object
      properties:
        scope:
          type: string
          enum:
          - local
          - yard
    Reachability:
      type: object
      properties:
        instances:
          type: array
          items:
            $ref: "#/components/schemas/InstanceReachability"
        noRoute:
          type: string
        passed:
          type: boolean
        routes:
          type: array
          items:
            $ref: "#/components/schemas/RouteReachability"
        service:
          type: string
        workstation:
          type: string
      required:
      - instances
      - passed
      - routes
      - service
      - workstation
    RouteReachability:
      type: object
      properties:
        error:
          type: string
        hostname:
          type: string
        reached:
          type: boolean
        status:
          type: integer
          format: int32
      required:
      - hostname
      - reached
    Routing:
      type: object
      properties:
        instances:
          type: array
          items:
            type: string
        kind:
          type: string
          enum:
          - static
          - bound
          - alias
      required:
      - instances
    Service:
      type: object
      properties:
        containerBindings:
          type: array
          items:
            $ref: "#/components/schemas/ContainerBinding"
        core:
          type: boolean
        hostname:
          type: string
        instances:
          type: array
          items:
            $ref: "#/components/schemas/Instance"
        name:
          type: string
        priority:
          type: array
          items:
            type: string
            enum:
            - static
            - bound
            - alias
        publication:
          $ref: "#/components/schemas/Publication"
        routing:
          $ref: "#/components/schemas/Routing"
        state:
          type: string
          enum:
          - unpublished
          - unavailable
          - unhealthy
          - healthy
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ServiceWarning"
        workstation:
          type: string
      required:
      - containerBindings
      - instances
      - name
      - state
      - warnings
      - workstation
    ServiceWarning:
      type: object
      properties:
        kind:
          type: string
          enum:
          - loopback-instance
          - unpublished-container-port
        message:
          type: string
      required:
      - kind
      - message
    StaticInstanceRequest:
      type: object
      properties:
        check:
          $ref: "#/components/schemas/HealthCheck"
        host:
          type: string
        meta:
          type: object
          additionalProperties:
            type: string
        port:
          type: integer
          format: int32
        tags:
          type: array
          items:
            type: string
      required:
      - port
    Status:
      type: object
      properties:
        overall:
          type: string
          enum:
          - ok
          - warning
          - failing
        parts:
          type: array
          items:
            $ref: "#/components/schemas/StatusPart"
      required:
      - overall
      - parts
    StatusDetail:
      type: object
      properties:
        name:
          type: string
        state:
          type: string
          enum:
          - ok
          - warning
          - failing
        value:
          type: string
      required:
      - name
      - value
    StatusPart:
      type: object
      properties:
        details:
          type: array
          items:
            $ref: "#/components/schemas/StatusDetail"
        name:
          type: string
        reason:
          type: string
        state:
          type: string
          enum:
          - ok
          - warning
          - failing
      required:
      - details
      - name
      - reason
      - state
    Yard:
      type: object
      properties:
        home:
          $ref: "#/components/schemas/HomeWorkstation"
        remotes:
          type: array
          items:
            $ref: "#/components/schemas/YardWorkstation"
      required:
      - home
      - remotes
    YardWorkstation:
      type: object
      properties:
        name:
          type: string
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        unreachable:
          type: boolean
      required:
      - name
      - services
      - unreachable
