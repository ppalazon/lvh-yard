openapi: 3.1.0
info:
  description: "The Yard's Workstations and Services, and this Workstation's Instances,\
    \ Publications and Aliases. A change to a Remote Service is refused with 405."
  title: LVH Yard
servers:
- url: /
paths:
  /api/services:
    get:
      description: "This Workstation's Services first, then by Workstation and name.\
        \ An unreachable Workstation's Services are left out: /api/yard shows which\
        \ ones."
      operationId: yardServices
      parameters:
      - description: Only the Services of this Workstation
        in: query
        name: workstation
        required: false
        schema:
          type: string
      - description: Only the Services in this state
        in: query
        name: state
        required: false
        schema:
          type: string
          enum:
          - unpublished
          - unavailable
          - unhealthy
          - degraded
          - healthy
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No Service state has this name
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The Yard has no Workstation of this name
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The Workstation is unreachable
      summary: Lists every Service in the Yard
      tags:
      - services-controller
  /api/services/{workstation}/{service}:
    get:
      operationId: yardService
      parameters:
      - in: path
        name: workstation
        required: true
        schema:
          type: string
      - in: path
        name: service
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The Yard has no Workstation of this name, or it has no Service\
            \ of this name"
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The Workstation is unreachable
      summary: Gets one Service
      tags:
      - services-controller
  /api/services/{workstation}/{service}/reachability:
    get:
      description: "Connects to each Instance, and requests each hostname through\
        \ this Workstation's Traefik. The results are not stored."
      operationId: testReachability
      parameters:
      - in: path
        name: workstation
        required: true
        schema:
          type: string
      - in: path
        name: service
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reachability"
          description: "Tested, whether the checks passed or not"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The Yard has no Workstation of this name, or it has no Service\
            \ of this name"
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The Workstation is unreachable
      summary: Tests whether this Workstation reaches a Service
      tags:
      - services-controller
  /api/status:
    get:
      description: "Each part is ok, warning or failing. The answer is kept for about\
        \ 5 s."
      operationId: status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: OK
      summary: Gets whether LVH Yard works on this Workstation
      tags:
      - status-controller
  /api/workstation/backup:
    get:
      description: "The Backup holds this Workstation's Services with their Publications,\
        \ Static Instances and Container Bindings, its Aliases and its Route Profiles.\
        \ It holds basic-auth hashes, so keep it private."
      operationId: backup
      responses:
        "200":
          content:
            application/yaml:
              schema:
                type: string
          description: "The Backup, as YAML"
      summary: Exports a Backup of this Workstation's setup
      tags:
      - backup-controller
    post:
      description: "Mode add adds what is new and skips what exists. Mode update also\
        \ overwrites what exists with the values of the file. publication: none unpublishes\
        \ a Service, and a missing publication key keeps its Publication. The dashboard\
        \ checks the whole file first. If one entry is wrong, nothing changes. A Static\
        \ Instance without a host is at this Workstation's LAN address. A new Service\
        \ without a publication key stays Unpublished."
      operationId: importBackup
      parameters:
      - description: "add: adds what is new and skips what exists. update: also overwrites\
          \ what exists."
        in: query
        name: mode
        required: true
        schema:
          type: string
      - description: true shows the plan and changes nothing.
        in: query
        name: dry-run
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/yaml:
            schema:
              type: string
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
          description: "The plan, and without a dry run what the import did"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The file is refused, or the mode is unknown, and nothing changes.\
            \ The problems give each place in the file and its reason"
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "A write failed halfway. The detail says where it stopped.\
            \ The applied entries stay, and applied lists them. safetyBackup names\
            \ the Backup to import to go back"
      summary: Imports a Backup into this Workstation
      tags:
      - backup-controller
  /api/workstation/containers:
    get:
      description: "Compose projects come first, then the other containers. Each port\
        \ is a TCP container port, with its host port when it is published. A stopped\
        \ container has no ports. followedBy names the Service of a Container Binding\
        \ that matches the container, whatever its port."
      operationId: containers
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ListedContainer"
          description: The containers
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Docker does not answer, so its containers are not known"
      summary: "Lists every container of this Workstation, stopped ones too"
      tags:
      - containers-controller
  /api/workstation/route-profiles:
    get:
      operationId: routeProfiles
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RouteProfile"
          description: OK
      summary: "Lists this Workstation's Route Profiles, with their types and the\
        \ Services that use them"
      tags:
      - route-profiles-controller
    put:
      description: The body maps each name to its middleware in Traefik's format.
        A chain may name a profile of the set or one that exists. The profiles that
        the body does not name stay. Answers the whole list.
      operationId: putRouteProfiles
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RouteProfile"
          description: Saved
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "A profile is refused, or the save writes more profiles than\
            \ Consul takes at once, and nothing changes. The detail gives the reason,\
            \ and the problems give each refused profile"
      summary: Adds or replaces a set of Route Profiles
      tags:
      - route-profiles-controller
  /api/workstation/route-profiles/{name}:
    delete:
      operationId: deleteRouteProfile
      parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Removed
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No Route Profile has this name
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: A Publication or a chain names it. The services and chains
            give their names
      summary: Removes one Route Profile
      tags:
      - route-profiles-controller
    get:
      operationId: routeProfile
      parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteProfileDetail"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No Route Profile has this name
      summary: "Gets one Route Profile, with its definition in Traefik's format"
      tags:
      - route-profiles-controller
    put:
      description: "The body is its middleware in Traefik's format, such as {\"headers\"\
        : {...}}."
      operationId: putRouteProfile
      parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteProfileDetail"
          description: Saved
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "A profile is refused, or the save writes more profiles than\
            \ Consul takes at once, and nothing changes. The detail gives the reason,\
            \ and the problems give each refused profile"
      summary: Adds or replaces one Route Profile
      tags:
      - route-profiles-controller
  /api/workstation/services:
    get:
      operationId: ownServices
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
          description: OK
      summary: Lists this Workstation's Services
      tags:
      - workstation-services-controller
    post:
      description: "The new Service is empty and Unpublished. It stays until you delete\
        \ it. When this Workstation already has a Service of this name, nothing changes\
        \ and the answer is that Service. That includes a Service that only Foreign\
        \ Instances give."
      operationId: createService
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewServiceRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
          description: The Service existed
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The name is not a single DNS label or is consul
      summary: "Creates a Service, unless it exists"
      tags:
      - workstation-services-controller
  /api/workstation/services/{service}:
    delete:
      description: "Removes its Publication, its Static Instances, and its Container\
        \ Bindings with their Bound Instances. Containers keep running. Foreign Instances\
        \ stay, and the Service stays while they do."
      operationId: deleteService
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Deleted
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: This Workstation has no Service of this name
      summary: Deletes a Service
      tags:
      - workstation-services-controller
    get:
      operationId: ownService
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: This Workstation has no Service of this name
      summary: Gets one of this Workstation's Services
      tags:
      - workstation-services-controller
  /api/workstation/services/{service}/aliases:
    get:
      description: "In the order of its Instance Priority, each with its state."
      operationId: aliases
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alias"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: This Workstation has no Service of this name
      summary: Lists the Aliases of a Service
      tags:
      - workstation-services-controller
    post:
      description: "The Alias goes to the end of the order, and gives the Instances\
        \ of the Remote Service. The Remote Service must have Yard Scope now. Later,\
        \ the Alias stays when the Remote Service loses Yard Scope or its Workstation\
        \ stops answering, and it then gives no Instances. Only this Workstation's\
        \ Route uses its Aliases. With create, a missing Service is created and published\
        \ with Local Scope."
      operationId: addAlias
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AliasRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddedAlias"
          description: "Added, with its state. serviceCreated says whether the Service\
            \ was missing and so was created, or the Alias joined an existing Service"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The name is not a single DNS label or is consul, the Workstation\
            \ or Service name is not a DNS label, the Workstation is this one, or\
            \ the Remote Service is not there with Yard Scope. The answer names the\
            \ field"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "This Workstation has no Service of this name, and create is\
            \ not true"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The Service already has an Alias to this Remote Service
      summary: Adds an Alias to a Remote Service
      tags:
      - workstation-services-controller
  /api/workstation/services/{service}/aliases/{workstation}/{remoteService}:
    delete:
      description: "The Service stays, even with nothing left."
      operationId: removeAlias
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      - in: path
        name: workstation
        required: true
        schema:
          type: string
      - in: path
        name: remoteService
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Removed
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "This Workstation has no such Service, or the Service has no\
            \ such Alias"
      summary: Removes an Alias
      tags:
      - workstation-services-controller
  /api/workstation/services/{service}/container-bindings:
    post:
      description: "Give either container, or composeProject and composeService. Each\
        \ running container that matches is a Bound Instance with a TCP check. Binding\
        \ the same target again, even with the same port, answers 409."
      operationId: bindContainer
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerBindingRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerBinding"
          description: Bound
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The name is not a single DNS label or is consul, the body\
            \ names both or neither of a container and a Compose service, a name is\
            \ not one Docker or Compose allows, or the port is not a TCP port"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: This Workstation has no Service of this name
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "A Container Binding of this Workstation already follows the\
            \ same container name, or the same Compose project and service, whatever\
            \ its port. The answer names its Service"
      summary: Binds a Service to a container or a Compose service
      tags:
      - workstation-services-controller
  /api/workstation/services/{service}/container-bindings/{id}:
    delete:
      description: "The Service stays, even with nothing left."
      operationId: unbindContainer
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Removed
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The Service has no Container Binding with this ID
      summary: Removes a Container Binding and its Bound Instances
      tags:
      - workstation-services-controller
  /api/workstation/services/{service}/instance-priority:
    get:
      description: "Its Instance Sources in order, whether the order is on, and the\
        \ source that the Route uses now."
      operationId: instancePriority
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstancePriority"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: This Workstation has no Service of this name
      summary: Gets the Instance Priority of a Service
      tags:
      - workstation-services-controller
    put:
      description: "The IDs in order go first, and the other sources follow in their\
        \ order. With on true, the Route uses the passing Instances of the first source\
        \ that has one. With on false, every passing Instance of every source shares\
        \ the Route, and the order stays. Unpublishing keeps both."
      operationId: setInstancePriority
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstancePriorityRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstancePriority"
          description: Set
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The order names an ID twice, or an ID that is not one of its\
            \ Instance Sources"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: This Workstation has no Service of this name
      summary: "Sets the order of the Instance Sources of a Service, or turns the\
        \ order on or off"
      tags:
      - workstation-services-controller
  /api/workstation/services/{service}/instances:
    post:
      description: "With no host, the Instance is at this Workstation's LAN address.\
        \ With no check, it gets a TCP check on its port. It is critical until its\
        \ check first passes. The same host and port again replaces that Instance,\
        \ which keeps its ID."
      operationId: register
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaticInstanceRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
          description: Registered
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The name is not a single DNS label or is consul. The host,\
            \ port, check, tags or meta break a rule"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: This Workstation has no Service of this name
      summary: Registers a Static Instance
      tags:
      - workstation-services-controller
  /api/workstation/services/{service}/instances/{id}:
    delete:
      operationId: remove
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Removed
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The Service has no Static Instance with this ID
      summary: Removes a Static Instance
      tags:
      - workstation-services-controller
    put:
      description: "A part left out gets its default, not its old value. The Instance\
        \ keeps its ID. It is critical until its check first passes."
      operationId: editInstance
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaticInstanceRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
          description: Edited
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The host, port, check, tags or meta break a rule. Or another\
            \ Instance of the Service is at the host and port"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The Service has no Static Instance with this ID
      summary: Edits a Static Instance
      tags:
      - workstation-services-controller
  /api/workstation/services/{service}/publication:
    delete:
      description: "The Service stays, Unpublished."
      operationId: unpublish
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      responses:
        "204":
          description: "Unpublished, or it was not published"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: This Workstation has no Service of this name
      summary: Unpublishes a Service
      tags:
      - workstation-services-controller
    put:
      description: "With Yard Scope, the other Workstations also route it, at <service>.<workstation>.<base-domain>.\
        \ With no Scope, a new Publication gets Local Scope and an existing one keeps\
        \ its own. The Route applies the Route Profiles in order, as Traefik middlewares\
        \ named <workstation>_<profile>. With no profiles, a Publication keeps its\
        \ own. Empty profiles remove them all. With accessLog true, Traefik logs the\
        \ requests to the Route. With no accessLog, a new Publication does not log\
        \ them and an existing one keeps its own."
      operationId: publish
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
          description: "The Service, published"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The name is not a single DNS label or is consul, the Scope\
            \ is not local or yard, or a Route Profile is not among this Workstation's\
            \ valid profiles"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: This Workstation has no Service of this name
      summary: "Publishes a Service, or changes its Scope, Route Profiles or access\
        \ log"
      tags:
      - workstation-services-controller
  /api/workstation/services/{service}/reachability:
    get:
      description: "As /api/services/{workstation}/{service}/reachability does, without\
        \ naming this Workstation."
      operationId: testOwnReachability
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reachability"
          description: "Tested, whether the checks passed or not"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: This Workstation has no Service of this name
      summary: Tests whether this Workstation reaches one of its own Services
      tags:
      - workstation-services-controller
  /api/yard:
    get:
      description: "The other Workstations come by name. An unreachable one has no\
        \ Services, and the others still load."
      operationId: yard
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Yard"
          description: OK
      summary: "Gets every Workstation of the Yard, with its Services"
      tags:
      - yard-controller
components:
  schemas:
    AddedAlias:
      type: object
      properties:
        id:
          type: string
        reason:
          type: string
        service:
          type: string
        serviceCreated:
          type: boolean
        state:
          type: string
          enum:
          - active
          - unavailable
          - not-shared
          - unreachable
          - missing
        workstation:
          type: string
      required:
      - id
      - service
      - serviceCreated
      - state
      - workstation
    Alias:
      type: object
      properties:
        id:
          type: string
        reason:
          type: string
        service:
          type: string
        state:
          type: string
          enum:
          - active
          - unavailable
          - not-shared
          - unreachable
          - missing
        workstation:
          type: string
      required:
      - id
      - service
      - state
      - workstation
    AliasRequest:
      type: object
      properties:
        create:
          type: boolean
          description: "true creates the Service when it does not exist, and publishes\
            \ it with Local Scope. An existing Service keeps its Publication."
        service:
          type: string
        workstation:
          type: string
      required:
      - service
      - workstation
    CheckResult:
      type: object
      properties:
        health:
          type: string
          enum:
          - passing
          - warning
          - critical
        name:
          type: string
        output:
          type: string
      required:
      - health
      - name
      - output
    ContainerBinding:
      type: object
      properties:
        composeProject:
          type: string
        composeService:
          type: string
        container:
          type: string
        id:
          type: string
        instances:
          type: array
          items:
            type: string
        port:
          type: integer
          format: int32
      required:
      - id
      - instances
      - port
    ContainerBindingRequest:
      type: object
      properties:
        composeProject:
          type: string
        composeService:
          type: string
        container:
          type: string
        port:
          type: integer
          format: int32
      required:
      - port
    ContainerPort:
      type: object
      properties:
        containerPort:
          type: integer
          format: int32
        hostIp:
          type: string
        hostPort:
          type: integer
          format: int32
      required:
      - containerPort
    ExportedFrom:
      type: object
      properties:
        at:
          type: string
        workstation:
          type: string
    HealthCheck:
      type: object
      properties:
        interval:
          type: string
        path:
          type: string
        timeout:
          type: string
        type:
          type: string
          enum:
          - http
          - tcp
    HomeWorkstation:
      type: object
      properties:
        name:
          type: string
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
      required:
      - name
      - services
    ImportResult:
      type: object
      properties:
        dryRun:
          type: boolean
        entries:
          type: array
          items:
            $ref: "#/components/schemas/PlanEntry"
        exportedFrom:
          $ref: "#/components/schemas/ExportedFrom"
        mode:
          type: string
          enum:
          - add
          - update
        safetyBackup:
          type: string
          description: "The safety Backup in the Backups folder, with the setup from\
            \ before the import. Only an import that changed something writes one."
      required:
      - dryRun
      - entries
      - mode
    Instance:
      type: object
      properties:
        check:
          $ref: "#/components/schemas/HealthCheck"
        checks:
          type: array
          items:
            $ref: "#/components/schemas/CheckResult"
        container:
          type: string
        containerBinding:
          type: string
        containerPort:
          type: integer
          format: int32
        foreign:
          type: boolean
        health:
          type: string
          enum:
          - passing
          - warning
          - critical
        host:
          type: string
        hostPort:
          type: integer
          format: int32
        id:
          type: string
        meta:
          type: object
          additionalProperties:
            type: string
        outOfRange:
          type: boolean
        port:
          type: integer
          format: int32
        tags:
          type: array
          items:
            type: string
        unpublishedContainerPort:
          type: boolean
      required:
      - checks
      - health
      - host
      - id
      - meta
      - outOfRange
      - port
      - tags
    InstancePriority:
      type: object
      properties:
        "on":
          type: boolean
          description: Whether the Route uses only the first Instance Source in the
            order with a passing Instance
        routing:
          $ref: "#/components/schemas/Routing"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/InstanceSource"
      required:
      - "on"
      - sources
    InstancePriorityRequest:
      type: object
      properties:
        "on":
          type: boolean
          description: "false makes every passing Instance of every source share the\
            \ Route. When left out, the toggle stays."
        order:
          type: array
          description: "Instance Source IDs. They go first, in this order, and the\
            \ other sources follow in their order. When left out, the order stays."
          items:
            type: string
    InstanceReachability:
      type: object
      properties:
        address:
          type: string
        error:
          type: string
        id:
          type: string
        outOfRange:
          type: boolean
        reached:
          type: boolean
        routed:
          type: boolean
      required:
      - address
      - id
      - reached
    InstanceSource:
      type: object
      properties:
        id:
          type: string
        instances:
          type: array
          items:
            type: string
        kind:
          type: string
          enum:
          - static
          - bound
          - alias
          - foreign
      required:
      - id
      - instances
      - kind
    ListedContainer:
      type: object
      properties:
        composeProject:
          type: string
        composeService:
          type: string
        followedBy:
          type: string
        health:
          type: string
          enum:
          - starting
          - healthy
          - unhealthy
        name:
          type: string
        ports:
          type: array
          items:
            $ref: "#/components/schemas/ContainerPort"
        running:
          type: boolean
        service:
          type: string
      required:
      - name
      - ports
      - running
      - service
    NewServiceRequest:
      type: object
      properties:
        name:
          type: string
          description: One DNS label
      required:
      - name
    PlanEntry:
      type: object
      properties:
        action:
          type: string
          enum:
          - add
          - update
          - skip
        kind:
          type: string
          enum:
          - route-profile
          - service
          - publication
          - instance-priority
          - static-instance
          - container-binding
          - alias
        name:
          type: string
        reason:
          type: string
        service:
          type: string
      required:
      - action
      - kind
      - name
    ProblemDetail:
      type: object
      additionalProperties: true
      properties:
        detail:
          type: string
        instance:
          type: string
          format: uri
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          format: uri
    Publication:
      type: object
      properties:
        accessLog:
          type: boolean
        scope:
          type: string
          enum:
          - local
          - yard
      required:
      - accessLog
      - scope
    PublicationRequest:
      type: object
      properties:
        accessLog:
          type: boolean
          description: "true makes Traefik log the requests to its Route. When left\
            \ out, a new Publication does not log them and an existing one keeps its\
            \ own."
        profiles:
          type: array
          description: "Names of this Workstation's Route Profiles, in the order the\
            \ Route applies them. Empty removes them all. When left out, a Publication\
            \ keeps its own."
          items:
            type: string
        scope:
          type: string
          enum:
          - local
          - yard
    Reachability:
      type: object
      properties:
        alias:
          $ref: "#/components/schemas/Alias"
        instances:
          type: array
          items:
            $ref: "#/components/schemas/InstanceReachability"
        noRoute:
          type: string
        passed:
          type: boolean
        routes:
          type: array
          items:
            $ref: "#/components/schemas/RouteReachability"
        routing:
          $ref: "#/components/schemas/Routing"
        service:
          type: string
        workstation:
          type: string
      required:
      - instances
      - passed
      - routes
      - service
      - workstation
    RouteProfile:
      type: object
      properties:
        name:
          type: string
        services:
          type: array
          description: The Services of this Workstation whose Publications name it.
          items:
            type: string
        type:
          type: string
          description: "Its Traefik middleware type, such as headers or basicAuth.\
            \ Missing when it has more or none."
      required:
      - name
      - services
    RouteProfileDetail:
      type: object
      properties:
        definition:
          type: object
          additionalProperties: {}
          description: "The middleware in Traefik's format, such as {\"basicAuth\"\
            : {\"users\": [...]}}."
        name:
          type: string
        services:
          type: array
          description: The Services of this Workstation whose Publications name it.
          items:
            type: string
        type:
          type: string
          description: "Its Traefik middleware type, such as headers or basicAuth.\
            \ Missing when it has more or none."
      required:
      - definition
      - name
      - services
    RouteReachability:
      type: object
      properties:
        error:
          type: string
        hostname:
          type: string
        reached:
          type: boolean
        status:
          type: integer
          format: int32
      required:
      - hostname
      - reached
    Routing:
      type: object
      properties:
        instances:
          type: array
          items:
            type: string
        kind:
          type: string
          description: The kind of the Instance Source that the Route uses now
          enum:
          - static
          - bound
          - alias
          - foreign
        "off":
          type: boolean
        source:
          type: string
          description: The ID of the Instance Source that the Route uses now
        waiting:
          type: array
          description: "The IDs of the other Instance Sources that have an Instance\
            \ in range, in order"
          items:
            type: string
      required:
      - instances
      - waiting
    Service:
      type: object
      properties:
        containerBindings:
          type: array
          items:
            $ref: "#/components/schemas/ContainerBinding"
        created:
          type: boolean
          description: "Whether its Home Workstation holds a record of it. If not,\
            \ only Foreign Instances give it, and the first change to it writes the\
            \ record"
        empty:
          type: boolean
          description: Whether it has no Instance Sources. Its Aliases count
        hostname:
          type: string
        instancePriority:
          type: boolean
          description: "Whether its Route uses only the first Instance Source in the\
            \ order with a passing Instance. When false, every passing Instance of\
            \ every source shares the Route"
        instances:
          type: array
          items:
            $ref: "#/components/schemas/Instance"
        name:
          type: string
        profiles:
          type: array
          description: "The names of its Route Profiles, in the order its Route applies\
            \ them"
          items:
            type: string
        publication:
          $ref: "#/components/schemas/Publication"
        routing:
          $ref: "#/components/schemas/Routing"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/InstanceSource"
        state:
          type: string
          enum:
          - unpublished
          - unavailable
          - unhealthy
          - degraded
          - healthy
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ServiceWarning"
        workstation:
          type: string
      required:
      - containerBindings
      - created
      - empty
      - instancePriority
      - instances
      - name
      - sources
      - state
      - warnings
      - workstation
    ServiceWarning:
      type: object
      properties:
        kind:
          type: string
          enum:
          - loopback-instance
          - unpublished-container-port
          - route-profile-auth
          - unknown-route-profile
          - foreign-instance
          - alias-above-source
        message:
          type: string
        severity:
          type: string
          enum:
          - error
          - risk
      required:
      - kind
      - message
      - severity
    StaticInstanceRequest:
      type: object
      properties:
        check:
          $ref: "#/components/schemas/HealthCheck"
        host:
          type: string
        meta:
          type: object
          additionalProperties:
            type: string
        port:
          type: integer
          format: int32
        tags:
          type: array
          items:
            type: string
      required:
      - port
    Status:
      type: object
      properties:
        overall:
          type: string
          enum:
          - ok
          - warning
          - failing
        parts:
          type: array
          items:
            $ref: "#/components/schemas/StatusPart"
      required:
      - overall
      - parts
    StatusDetail:
      type: object
      properties:
        name:
          type: string
        state:
          type: string
          enum:
          - ok
          - warning
          - failing
        value:
          type: string
      required:
      - name
      - value
    StatusPart:
      type: object
      properties:
        details:
          type: array
          items:
            $ref: "#/components/schemas/StatusDetail"
        name:
          type: string
        reason:
          type: string
        state:
          type: string
          enum:
          - ok
          - warning
          - failing
      required:
      - details
      - name
      - reason
      - state
    Yard:
      type: object
      properties:
        home:
          $ref: "#/components/schemas/HomeWorkstation"
        remotes:
          type: array
          items:
            $ref: "#/components/schemas/YardWorkstation"
      required:
      - home
      - remotes
    YardWorkstation:
      type: object
      properties:
        name:
          type: string
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        unreachable:
          type: boolean
      required:
      - name
      - services
      - unreachable
