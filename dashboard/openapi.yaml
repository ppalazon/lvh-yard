openapi: 3.1.0
info:
  description: "The Yard's Workstations and Services, and this Workstation's Instances,\
    \ Publications and Aliases. A change to a Remote Service is refused with 405."
  title: LVH Yard
servers:
- url: /
paths:
  /api/services:
    get:
      description: "This Workstation's Services first, then by Workstation and name.\
        \ An unreachable Workstation's Services are left out: /api/yard shows which\
        \ ones."
      operationId: yardServices
      parameters:
      - description: Only the Services of this Workstation
        in: query
        name: workstation
        required: false
        schema:
          type: string
      - description: Only the Services in this state
        in: query
        name: state
        required: false
        schema:
          type: string
          enum:
          - unpublished
          - unavailable
          - unhealthy
          - healthy
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No Service state has this name
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The Yard has no Workstation of this name
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The Workstation is unreachable
      summary: Lists every Service in the Yard
      tags:
      - services-controller
  /api/services/{workstation}/{service}:
    get:
      operationId: yardService
      parameters:
      - in: path
        name: workstation
        required: true
        schema:
          type: string
      - in: path
        name: service
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The Yard has no Workstation of this name, or it has no Service\
            \ of this name"
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The Workstation is unreachable
      summary: Gets one Service
      tags:
      - services-controller
  /api/services/{workstation}/{service}/reachability:
    get:
      description: "Connects to each Instance, and requests each hostname through\
        \ this Workstation's Traefik. The results are not stored."
      operationId: testReachability
      parameters:
      - in: path
        name: workstation
        required: true
        schema:
          type: string
      - in: path
        name: service
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reachability"
          description: "Tested, whether the checks passed or not"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The Yard has no Workstation of this name, or it has no Service\
            \ of this name"
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The Workstation is unreachable
      summary: Tests whether this Workstation reaches a Service
      tags:
      - services-controller
  /api/status:
    get:
      description: "Each part is ok, warning or failing. The answer is kept for about\
        \ 5 s."
      operationId: status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: OK
      summary: Gets whether LVH Yard works on this Workstation
      tags:
      - status-controller
  /api/workstation/aliases:
    get:
      operationId: aliases
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alias"
          description: OK
      summary: Lists this Workstation's Aliases
      tags:
      - aliases-controller
  /api/workstation/aliases/{alias}:
    delete:
      operationId: removeAlias
      parameters:
      - in: path
        name: alias
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Removed
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: This Workstation has no Alias of this name
      summary: Removes an Alias
      tags:
      - aliases-controller
    put:
      operationId: addAlias
      parameters:
      - in: path
        name: alias
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AliasRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alias"
          description: "The Alias, with its state"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The name is not a single DNS label or is consul, or the Workstation\
            \ is this one"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The Yard has no Workstation of this name, or it has no Service\
            \ of this name"
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The Workstation is unreachable, so its Services are not known"
      summary: Adds an Alias for a Remote Service
      tags:
      - aliases-controller
  /api/workstation/backup:
    get:
      description: "The Backup holds this Workstation's Services with their Publications,\
        \ Static Instances and Container Bindings, its Aliases and its Route Profiles.\
        \ It holds basic-auth hashes, so keep it private."
      operationId: backup
      responses:
        "200":
          content:
            application/yaml:
              schema:
                type: string
          description: "The Backup, as YAML"
      summary: Exports a Backup of this Workstation's setup
      tags:
      - backup-controller
    post:
      description: "Mode add adds what is new and skips what exists. The dashboard\
        \ checks the whole file first. If one entry is wrong, nothing changes. A Static\
        \ Instance without a host is at this Workstation's LAN address. A new Service\
        \ without a publication key stays Unpublished."
      operationId: importBackup
      parameters:
      - description: "add: adds what is new and skips what exists."
        in: query
        name: mode
        required: true
        schema:
          type: string
      - description: true shows the plan and changes nothing.
        in: query
        name: dry-run
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/yaml:
            schema:
              type: string
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
          description: "The plan, and without a dry run what the import did"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The file is refused, or the mode is unknown, and nothing changes.\
            \ The problems give each place in the file and its reason"
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "A write failed halfway. The applied entries stay, and the\
            \ detail says where it stopped"
      summary: Imports a Backup into this Workstation
      tags:
      - backup-controller
  /api/workstation/containers:
    get:
      description: "Compose projects come first, then the other containers. Each port\
        \ is a TCP container port, with its host port when it is published."
      operationId: containers
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UnfollowedContainer"
          description: The containers
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Docker does not answer, so its containers are not known"
      summary: Lists the running containers that no Container Binding follows
      tags:
      - containers-controller
  /api/workstation/containers/{container}/register:
    post:
      description: "Binds a running container by Compose project and service when\
        \ it has them, else by container name. Binds a container that does not run\
        \ by its name. The Service is named after the Compose service or the container,\
        \ cleaned to follow the Service name rule, unless service is given. The port\
        \ is needed when the container does not run, or does not have exactly one\
        \ TCP port. A new Service is published with Local Scope, unless publish is\
        \ false. A Service that exists keeps its Publication, or stays Unpublished.\
        \ The body can be left out."
      operationId: registerContainer
      parameters:
      - in: path
        name: container
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerRegistrationRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
          description: "The Service, with the container bound"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The name is not a single DNS label or is consul, or the port\
            \ is missing or not a TCP port"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: A Container Binding already follows the container
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Docker does not answer, so its containers are not known"
      summary: Gives a container a Service
      tags:
      - containers-controller
  /api/workstation/route-profiles:
    get:
      operationId: routeProfiles
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RouteProfile"
          description: OK
      summary: "Lists this Workstation's Route Profiles, with their types and the\
        \ Services that use them"
      tags:
      - route-profiles-controller
    put:
      description: The body maps each name to its middleware in Traefik's format.
        A chain may name a profile of the set or one that exists. The profiles that
        the body does not name stay. Answers the whole list.
      operationId: putRouteProfiles
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RouteProfile"
          description: Saved
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "A profile is refused, or the save writes more profiles than\
            \ Consul takes at once, and nothing changes. The detail gives the reason,\
            \ and the problems give each refused profile"
      summary: Adds or replaces a set of Route Profiles
      tags:
      - route-profiles-controller
  /api/workstation/route-profiles/{name}:
    delete:
      operationId: deleteRouteProfile
      parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Removed
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No Route Profile has this name
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: A Publication or a chain names it. The services and chains
            give their names
      summary: Removes one Route Profile
      tags:
      - route-profiles-controller
    get:
      operationId: routeProfile
      parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteProfileDetail"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No Route Profile has this name
      summary: "Gets one Route Profile, with its definition in Traefik's format"
      tags:
      - route-profiles-controller
    put:
      description: "The body is its middleware in Traefik's format, such as {\"headers\"\
        : {...}}."
      operationId: putRouteProfile
      parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteProfileDetail"
          description: Saved
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "A profile is refused, or the save writes more profiles than\
            \ Consul takes at once, and nothing changes. The detail gives the reason,\
            \ and the problems give each refused profile"
      summary: Adds or replaces one Route Profile
      tags:
      - route-profiles-controller
  /api/workstation/services:
    get:
      operationId: ownServices
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
          description: OK
      summary: Lists this Workstation's Services
      tags:
      - workstation-services-controller
  /api/workstation/services/{service}:
    get:
      operationId: ownService
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: This Workstation has no Service of this name
      summary: Gets one of this Workstation's Services
      tags:
      - workstation-services-controller
  /api/workstation/services/{service}/container-bindings:
    post:
      description: "Give either container, or composeProject and composeService. Each\
        \ running container that matches is a Bound Instance with a TCP check. A new\
        \ Service gets a Publication with Local Scope, unless publish is false. Binding\
        \ the same target again, even with the same port, answers 409."
      operationId: bindContainer
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerBindingRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerBinding"
          description: Bound
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The name is not a single DNS label or is consul, the body\
            \ names both or neither of a container and a Compose service, a name is\
            \ not one Docker or Compose allows, or the port is not a TCP port"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "A Container Binding of this Workstation already follows the\
            \ same container name, or the same Compose project and service, whatever\
            \ its port. The answer names its Service"
      summary: Binds a Service to a container or a Compose service
      tags:
      - workstation-services-controller
  /api/workstation/services/{service}/container-bindings/{id}:
    delete:
      description: A Service with nothing left leaves the Catalog.
      operationId: unbindContainer
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Removed
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The Service has no Container Binding with this ID
      summary: Removes a Container Binding and its Bound Instances
      tags:
      - workstation-services-controller
  /api/workstation/services/{service}/instances:
    post:
      description: "With no host, the Instance is at this Workstation's LAN address.\
        \ With no check, it gets a TCP check on its port. It is critical until its\
        \ check first passes. The same host and port again replaces that Instance,\
        \ which keeps its ID. A new Service gets a Publication with Local Scope, unless\
        \ publish is false."
      operationId: register
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaticInstanceRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
          description: Registered
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The name is not a single DNS label or is consul. The host,\
            \ port, check, tags or meta break a rule"
      summary: Registers a Static Instance
      tags:
      - workstation-services-controller
  /api/workstation/services/{service}/instances/{id}:
    delete:
      operationId: remove
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Removed
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The Service has no Static Instance with this ID
      summary: Removes a Static Instance
      tags:
      - workstation-services-controller
    put:
      description: "A part left out gets its default, not its old value. The Instance\
        \ keeps its ID. It is critical until its check first passes."
      operationId: editInstance
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaticInstanceRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
          description: Edited
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The host, port, check, tags or meta break a rule. Or another\
            \ Instance of the Service is at the host and port"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The Service has no Static Instance with this ID
      summary: Edits a Static Instance
      tags:
      - workstation-services-controller
  /api/workstation/services/{service}/publication:
    delete:
      description: A Service with no Instances left leaves the Catalog.
      operationId: unpublish
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      responses:
        "204":
          description: "Unpublished, or it was not published"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: This Workstation has no Service of this name
      summary: Unpublishes a Service
      tags:
      - workstation-services-controller
    put:
      description: "With Yard Scope, the other Workstations also route it, at <service>.<workstation>.<base-domain>.\
        \ With no Scope, a new Publication gets Local Scope and an existing one keeps\
        \ its own. With no priority, a new Publication gets static, bound, alias and\
        \ an existing one keeps its own. An empty priority turns the Instance Priority\
        \ off: the passing Static and Bound Instances share the Route. The Route applies\
        \ the Route Profiles in order, as Traefik middlewares named <workstation>_<profile>.\
        \ With no profiles, a Publication keeps its own. Empty profiles remove them\
        \ all."
      operationId: publish
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
          description: "The Service, published"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The name is not a single DNS label or is consul, the Scope\
            \ is not local or yard, the priority repeats a kind or names an unknown\
            \ one, or a Route Profile is not among this Workstation's valid profiles"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: This Workstation has no Service of this name
      summary: "Publishes a Service, or changes its Scope, Instance Priority or Route\
        \ Profiles"
      tags:
      - workstation-services-controller
  /api/workstation/services/{service}/reachability:
    get:
      description: "As /api/services/{workstation}/{service}/reachability does, without\
        \ naming this Workstation."
      operationId: testOwnReachability
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reachability"
          description: "Tested, whether the checks passed or not"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: This Workstation has no Service of this name
      summary: Tests whether this Workstation reaches one of its own Services
      tags:
      - workstation-services-controller
  /api/yard:
    get:
      description: "The other Workstations come by name. An unreachable one has no\
        \ Services, and the others still load."
      operationId: yard
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Yard"
          description: OK
      summary: "Gets every Workstation of the Yard, with its Services"
      tags:
      - yard-controller
components:
  schemas:
    Alias:
      type: object
      properties:
        hostname:
          type: string
        name:
          type: string
        reason:
          type: string
        service:
          type: string
        state:
          type: string
          enum:
          - active
          - unavailable
          - fallback
          - hidden
          - not-shared
          - unreachable
          - missing
        workstation:
          type: string
      required:
      - hostname
      - name
      - service
      - state
      - workstation
    AliasRequest:
      type: object
      properties:
        service:
          type: string
        workstation:
          type: string
      required:
      - service
      - workstation
    CheckResult:
      type: object
      properties:
        health:
          type: string
          enum:
          - passing
          - warning
          - critical
        name:
          type: string
        output:
          type: string
      required:
      - health
      - name
      - output
    ContainerBinding:
      type: object
      properties:
        composeProject:
          type: string
        composeService:
          type: string
        container:
          type: string
        id:
          type: string
        instances:
          type: array
          items:
            type: string
        port:
          type: integer
          format: int32
      required:
      - id
      - instances
      - port
    ContainerBindingRequest:
      type: object
      properties:
        composeProject:
          type: string
        composeService:
          type: string
        container:
          type: string
        port:
          type: integer
          format: int32
        publish:
          type: boolean
          description: "If the Service is new, false leaves it Unpublished. Otherwise\
            \ it gets a Publication with Local Scope. An existing Service keeps its\
            \ Publication, or stays Unpublished."
      required:
      - port
    ContainerPort:
      type: object
      properties:
        containerPort:
          type: integer
          format: int32
        hostPort:
          type: integer
          format: int32
      required:
      - containerPort
    ContainerRegistrationRequest:
      type: object
      properties:
        port:
          type: integer
          format: int32
        publish:
          type: boolean
        service:
          type: string
    ExportedFrom:
      type: object
      properties:
        at:
          type: string
        workstation:
          type: string
    HealthCheck:
      type: object
      properties:
        interval:
          type: string
        path:
          type: string
        timeout:
