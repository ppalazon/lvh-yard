openapi: 3.1.0
info:
  description: "The Workstations and Services of the Yard, read only, and the Static\
    \ Instances and Publications of this Workstation's Services. A Remote Service\
    \ can be changed only on its Home Workstation, so a change asked under /api/services\
    \ is refused with 405."
  title: LVH Yard
servers:
- url: /
paths:
  /api/services:
    get:
      description: "This Workstation's Services first, then the others' by Workstation\
        \ and name. The Services of an unreachable Workstation are left out; /api/yard\
        \ shows which ones are."
      operationId: yardServices
      parameters:
      - description: Only the Services of this Workstation
        in: query
        name: workstation
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The Yard has no Workstation of this name
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The Workstation asked for is unreachable: its Consul datacenter\
            \ does not answer"
      summary: "Every Service in the Yard, with its Instances and their Health"
      tags:
      - services-controller
  /api/services/{workstation}/{service}:
    get:
      operationId: yardService
      parameters:
      - in: path
        name: workstation
        required: true
        schema:
          type: string
      - in: path
        name: service
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The Yard has no Workstation of this name, or it has no Service\
            \ of this name"
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The Workstation is unreachable: its Consul datacenter does\
            \ not answer"
      summary: "One Service, with its Instances and their Health"
      tags:
      - services-controller
  /api/workstation/services:
    get:
      operationId: ownServices
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
          description: OK
      summary: "This Workstation's Services, with their Instances and their Health"
      tags:
      - workstation-services-controller
  /api/workstation/services/{service}:
    get:
      operationId: ownService
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: This Workstation has no Service of this name
      summary: "One of this Workstation's Services, with its Instances and their Health"
      tags:
      - workstation-services-controller
  /api/workstation/services/{service}/instances:
    post:
      description: "With no check, the Instance gets a TCP check on its port. It is\
        \ critical until its check first passes. Registering the same host and port\
        \ again replaces that Instance, which keeps its ID."
      operationId: register
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaticInstanceRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
          description: Registered
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The name is not a single DNS label or is yard. The host is\
            \ not an IP address or a hostname, the port is missing or not a TCP port,\
            \ the check is not http or tcp or has a bad path, interval or timeout,\
            \ or a tag or a meta key breaks its rules"
      summary: "Registers a Static Instance; with no host, at this Workstation's LAN\
        \ address"
      tags:
      - workstation-services-controller
  /api/workstation/services/{service}/instances/{id}:
    delete:
      operationId: remove
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Removed
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The Service has no Static Instance with this ID
      summary: Removes a Static Instance; a Service with nothing left leaves the Catalog
      tags:
      - workstation-services-controller
    put:
      description: "The Instance becomes what the body says, as when it is registered:\
        \ a part left out gets its default, not its old value. It is critical until\
        \ its check first passes."
      operationId: editInstance
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaticInstanceRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
          description: Edited
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The host is not an IP address or a hostname, the port is missing\
            \ or not a TCP port, the check is not http or tcp or has a bad path, interval\
            \ or timeout, or a tag or a meta key breaks its rules. Or another Instance\
            \ of the Service is at the host and port"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The Service has no Static Instance with this ID
      summary: "Edits a Static Instance, which stays the same Instance"
      tags:
      - workstation-services-controller
  /api/workstation/services/{service}/publication:
    delete:
      description: A Service with no Instances left leaves the Catalog.
      operationId: unpublish
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      responses:
        "204":
          description: "Unpublished, or it was not published"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: This Workstation has no Service of this name
      summary: "Unpublishes a Service, which keeps every Instance registered"
      tags:
      - workstation-services-controller
    put:
      description: "The Route covers every Instance of the Service, including ones\
        \ registered later. With Yard Scope, every other Workstation also routes it,\
        \ at <service>.<workstation>.<base-domain>. With no Scope, a new Publication\
        \ gets Local Scope and one that exists keeps its own, so publishing again\
        \ changes nothing."
      operationId: publish
      parameters:
      - in: path
        name: service
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
          description: "The Service, published"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The name is not a single DNS label or is yard, or the Scope\
            \ is not local or yard"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: This Workstation has no Service of this name
      summary: "Publishes a Service at <service>.<base-domain>, or changes its Scope"
      tags:
      - workstation-services-controller
  /api/yard:
    get:
      description: "The other Workstations come by name. One whose Consul datacenter\
        \ does not answer is unreachable, with no Services, and the others still load."
      operationId: yard
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Yard"
          description: OK
      summary: "This Workstation and every other one in the Yard, with their Services"
      tags:
      - yard-controller
components:
  schemas:
    CheckResult:
      type: object
      properties:
        health:
          type: string
          enum:
          - passing
          - warning
          - critical
        name:
          type: string
        output:
          type: string
      required:
      - health
      - name
      - output
    HealthCheck:
      type: object
      properties:
        interval:
          type: string
        path:
          type: string
        timeout:
          type: string
        type:
          type: string
          enum:
          - http
          - tcp
    HomeWorkstation:
      type: object
      properties:
        name:
          type: string
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
      required:
      - name
      - services
    Instance:
      type: object
      properties:
        check:
          $ref: "#/components/schemas/HealthCheck"
        checks:
          type: array
          items:
            $ref: "#/components/schemas/CheckResult"
        health:
          type: string
          enum:
          - passing
          - warning
          - critical
        host:
          type: string
        id:
          type: string
        meta:
          type: object
          additionalProperties:
            type: string
        port:
          type: integer
          format: int32
        tags:
          type: array
          items:
            type: string
      required:
      - checks
      - health
      - host
      - id
      - meta
      - port
      - tags
    ProblemDetail:
      type: object
      additionalProperties: true
      properties:
        detail:
          type: string
        instance:
          type: string
          format: uri
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          format: uri
    Publication:
      type: object
      properties:
        scope:
          type: string
          enum:
          - local
          - yard
      required:
      - scope
    PublicationRequest:
      type: object
      properties:
        scope:
          type: string
          enum:
          - local
          - yard
    Service:
      type: object
      properties:
        hostname:
          type: string
        instances:
          type: array
          items:
            $ref: "#/components/schemas/Instance"
        name:
          type: string
        publication:
          $ref: "#/components/schemas/Publication"
        state:
          type: string
          enum:
          - unpublished
          - unavailable
          - unhealthy
          - healthy
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ServiceWarning"
        workstation:
          type: string
        yardHostname:
          type: string
      required:
      - instances
      - name
      - state
      - warnings
      - workstation
    ServiceWarning:
      type: object
      properties:
        kind:
          type: string
          enum:
          - loopback-instance
        message:
          type: string
      required:
      - kind
      - message
    StaticInstanceRequest:
      type: object
      properties:
        check:
          $ref: "#/components/schemas/HealthCheck"
        host:
          type: string
        meta:
          type: object
          additionalProperties:
            type: string
        port:
          type: integer
          format: int32
        tags:
          type: array
          items:
            type: string
      required:
      - port
    Yard:
      type: object
      properties:
        home:
          $ref: "#/components/schemas/HomeWorkstation"
        remotes:
          type: array
          items:
            $ref: "#/components/schemas/YardWorkstation"
      required:
      - home
      - remotes
    YardWorkstation:
      type: object
      properties:
        name:
          type: string
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        unreachable:
          type: boolean
      required:
      - name
      - services
      - unreachable
